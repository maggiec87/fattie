<style>
/* ===========================================================
   轻记 · 减脂日志  设计系统
   暖纸底 + 松绿主色 + 珊瑚强调色
   =========================================================== */

:root{
  --bg:#FBF9F6;
  --bg-deep:#F3EFE9;
  --surface:#FFFFFF;
  --surface-2:#F7F4EF;
  --line:#E9E4DB;
  --line-strong:#DAD3C7;

  --text:#1D1C1A;
  --text-2:#57524B;
  --muted:#8A8377;

  --primary:#1F5F4B;
  --primary-2:#2C7D63;
  --primary-soft:#E7F1EC;
  --primary-line:#C6DFD4;

  --accent:#DE6B32;
  --accent-soft:#FBEBE0;

  --good:#2C7D57;
  --good-soft:#E6F2EB;
  --warn:#B4761A;
  --warn-soft:#FBF1DE;
  --bad:#B8452B;
  --bad-soft:#FAE9E4;

  --ink-soft:#EFEAE2;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;

  --shadow-1:0 1px 2px rgba(29,28,26,.04), 0 6px 18px -12px rgba(29,28,26,.18);
  --shadow-2:0 2px 6px rgba(29,28,26,.06), 0 18px 40px -20px rgba(29,28,26,.28);

  --tap:44px;
  --pad:16px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
  padding-bottom:calc(64px + var(--safe-b));
}
body:has(.sheet:not([hidden])){overflow:hidden}

.icon-defs{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* ---------------- 顶栏 ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding-top:var(--safe-t);
  background:rgba(251,249,246,.86);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.topbar.is-stuck{border-bottom-color:var(--line)}
.tb-inner{
  max-width:520px;margin:0 auto;
  height:54px;padding:0 var(--pad);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.tb-brand{font-size:17px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.tb-sub{font-size:12px;color:var(--muted);line-height:1.3}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.tb-btn{
  min-height:34px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-2);
  display:inline-flex;align-items:center;gap:6px;
}
.tb-btn .ic{width:16px;height:16px}
.tb-btn:active{background:var(--surface-2)}
.tb-btn.is-primary{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------------- 主体 ---------------- */
.view{max-width:520px;margin:0 auto;padding:14px var(--pad) 28px;min-height:60vh}
.sec-title{
  font-size:13px;font-weight:700;color:var(--muted);
  letter-spacing:.08em;margin:22px 2px 10px;
}
.sec-title:first-child{margin-top:4px}

/* ---------------- 卡片 ---------------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  margin-bottom:12px;
  overflow:hidden;
}
.card-hd{
  display:flex;align-items:center;gap:10px;
  padding:14px var(--pad) 0;
}
.card-hd .ic-badge{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);
}
.ic-badge .ic{width:17px;height:17px}
.card-hd h3{font-size:15px;font-weight:700;flex:1;letter-spacing:.01em}
.card-hd .hd-note{font-size:12px;color:var(--muted);font-weight:500}
.card-bd{padding:14px var(--pad) var(--pad)}

/* ---------------- 可折叠卡片（默认收起，点标题栏展开） ---------------- */
.fold-hd{
  width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;
  cursor:pointer;min-height:56px;padding:12px var(--pad);
  transition:background .15s;
}
.fold-hd:active{background:var(--surface-2)}
.fold-hd h3{flex:0 1 auto}
.fold-hd .hd-note{
  flex:1;min-width:0;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.fold-hd .chev{
  flex:none;color:var(--muted);display:grid;place-items:center;
  transition:transform .18s ease;
}
.fold-hd .chev .ic{width:16px;height:16px}
.fold-open .fold-hd .chev{transform:rotate(180deg)}
.card.fold .card-bd{display:none}
.card.fold.fold-open .card-bd{display:block;animation:foldIn .18s ease}
@keyframes foldIn{from{opacity:.35;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* ---------------- 表单控件 ---------------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{
  width:100%;min-height:var(--tap);
  padding:10px 12px;
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:var(--r-md);
  font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;
  outline:none;
  transition:border-color .15s, background .15s;
  -webkit-appearance:none;appearance:none;
}
.inp::placeholder{color:#B3ADA3;font-weight:400}
.inp:focus{background:var(--surface);border-color:var(--primary-line);box-shadow:0 0 0 3px rgba(31,95,75,.08)}
textarea.inp{min-height:72px;resize:vertical;font-weight:400;line-height:1.6}
.inp-unit{position:relative}
.inp-unit .u{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--muted);font-weight:600;pointer-events:none;
}
.inp-unit .inp{padding-right:44px}
input[type="date"].inp,input[type="time"].inp{min-height:var(--tap)}
input[type="date"].inp::-webkit-calendar-picker-indicator,
input[type="time"].inp::-webkit-calendar-picker-indicator{opacity:.45}

/* 分段控件 */
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:var(--r-md)}
.seg button{
  flex:1;min-height:44px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--muted);
  transition:all .15s;white-space:nowrap;
}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(29,28,26,.1)}

/* 情绪选择 */
.mood-row{display:flex;gap:8px}
.mood-row button{
  flex:1;min-height:52px;border-radius:var(--r-md);
  background:var(--surface-2);border:1.5px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:600;color:var(--muted);
  transition:all .15s;
}
.mood-row .em{font-size:20px;line-height:1}
.mood-row button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* 星级 */
.stars{display:flex;gap:2px}
.stars button{
  width:42px;height:44px;flex:0 0 42px;
  display:grid;place-items:center;
  font-size:28px;line-height:1;color:var(--line-strong);
  transition:color .12s,transform .12s;
}
.stars button.on{color:#E8A33D}
.stars button:active{transform:scale(.9)}

/* 按钮 */
.btn{
  min-height:var(--tap);padding:0 16px;border-radius:var(--r-md);
  font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface-2);color:var(--text-2);
  border:1px solid transparent;
  transition:all .15s;
}
.btn .ic{width:18px;height:18px}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--text-2)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 12px;font-size:13.5px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.link-btn{font-size:13px;font-weight:600;color:var(--primary);padding:6px 2px;display:inline-flex;align-items:center;gap:5px}
.link-btn .ic{width:15px;height:15px}

/* 小标签 */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  min-height:32px;padding:5px 12px;border-radius:999px;
  background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2);
  border:1px solid transparent;
  display:inline-flex;align-items:center;gap:5px;
}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line)}
.chip-x{font-size:15px;line-height:1;color:var(--muted);padding-left:2px}

/* ---------------- 进度 ---------------- */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ring-txt{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.ring .rt-num{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.ring .rt-lb{font-size:10.5px;color:var(--muted);font-weight:600}

.kv-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kv .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.bar{height:8px;border-radius:999px;background:var(--ink-soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar.accent > i{background:var(--accent)}

/* 数据块 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:var(--surface-2);border-radius:var(--r-md);
  padding:11px 12px;min-width:0;
}
.stat .s-lb{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.stat .s-v{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s-v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.tone-good .s-v{color:var(--good)}
.stat.tone-accent .s-v{color:var(--accent)}
.delta{font-size:12.5px;font-weight:700;white-space:nowrap}
.delta.down{color:var(--good)}
.delta.up{color:var(--accent)}
.delta.flat{color:var(--muted)}

/* ---------------- 运动/饮食条目 ---------------- */
.item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:var(--r-md);
  background:var(--surface-2);margin-bottom:8px;
}
.item .it-main{flex:1;min-width:0}
.item .it-t{font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.item .it-s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.item .it-x{
  width:32px;height:32px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--muted);background:var(--surface);
}
.item .it-x .ic{width:16px;height:16px}
.item-add{
  width:100%;min-height:42px;border-radius:var(--r-md);
  border:1.5px dashed var(--line-strong);color:var(--primary);
  font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.item-add .ic{width:17px;height:17px}
.item-add:active{background:var(--primary-soft)}

/* 照片 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{
  position:relative;aspect-ratio:1;border-radius:var(--r-md);
  overflow:hidden;background:var(--surface-2);border:1px solid var(--line);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .p-x{
  position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(20,20,20,.55);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(4px);
}
.photo .p-x .ic{width:13px;height:13px;stroke-width:2.2}
.photo-add{
  aspect-ratio:1;border-radius:var(--r-md);
  border:1.5px dashed var(--line-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--muted);font-size:12px;font-weight:600;
}
.photo-add .ic{width:22px;height:22px}
.photo-add:active{background:var(--primary-soft);color:var(--primary)}

.meal-block{padding:12px 0 4px;border-top:1px dashed var(--line)}
.meal-block:first-child{border-top:0;padding-top:0}
.meal-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.meal-hd .mh-t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.meal-hd .mh-t .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.meal-hd .inp-time{
  flex:0 0 auto;width:auto;min-width:102px;min-height:44px;
  padding:0 10px;font-size:13.5px;font-weight:600;text-align:center;
  font-variant-numeric:tabular-nums;
}
.meal-hd .mh-add{
  flex:none;width:40px;height:40px;border-radius:11px;border:0;
  background:var(--surface-2);color:var(--primary);
  display:grid;place-items:center;
}
.meal-hd .mh-add .ic{width:18px;height:18px}
.meal-hd .mh-add:active{background:var(--primary-soft)}

/* 饮食照片默认收起，点一下才展开 */
.ph-toggle{
  display:flex;align-items:center;gap:7px;width:100%;min-height:40px;
  margin-top:8px;padding:0 12px;border-radius:var(--r-sm);border:0;
  background:var(--surface-2);color:var(--text-2);
  font-size:13px;font-weight:600;
}
.ph-toggle .ic{width:16px;height:16px;color:var(--primary)}
.ph-toggle .chev{margin-left:auto;display:grid;place-items:center;color:var(--muted);transition:transform .18s ease}
.ph-toggle .chev .ic{width:15px;height:15px;color:var(--muted)}
.meal-block.ph-open .ph-toggle .chev{transform:rotate(180deg)}
.meal-block .photo-grid{display:none}
.meal-block.ph-open .photo-grid{display:grid}

/* ---------------- 日历 ---------------- */
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-hd .ch-m{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:44px;height:44px;border-radius:12px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--text-2);
}
.cal-nav button:active{background:var(--ink-soft)}
.cal-nav .ic{width:17px;height:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{
  text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:5px;
}
.cal-d{
  position:relative;aspect-ratio:1/1;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.cal-d.blank{color:transparent;pointer-events:none}
.cal-d.out{color:#C8C2B8;font-weight:400}
.cal-d.has{background:var(--primary-soft);color:var(--primary)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cal-d.sel{background:var(--primary);color:#fff}
.cal-d .mark{
  position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);
}
.cal-d.sel .mark{background:#fff}
.cal-d.has .mark{background:var(--primary-2)}
.cal-d.sel .mark{background:#fff}

/* ---------------- 图表 ---------------- */
.chart-wrap{margin-top:4px}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-empty{
  padding:30px 0;text-align:center;color:var(--muted);font-size:13.5px;
}
.chart-tip{
  font-size:12px;color:var(--muted);margin-top:8px;text-align:center;
}

/* ---------------- 空态 ---------------- */
.empty{
  padding:36px 20px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty .ic{width:34px;height:34px;opacity:.4}
.empty p{font-size:13.5px;line-height:1.6}

/* ---------------- 底部导航 ---------------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(251,249,246,.92);
  backdrop-filter:saturate(140%) blur(16px);
  -webkit-backdrop-filter:saturate(140%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar-inner{
  max-width:520px;margin:0 auto;
  height:60px;display:grid;grid-template-columns:repeat(4,1fr);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;font-weight:600;
  transition:color .15s;position:relative;
}
.tab .ic{width:21px;height:21px}
.tab.on{color:var(--primary)}
.tab.on::after{
  content:"";position:absolute;top:0;width:22px;height:2.5px;border-radius:0 0 3px 3px;
  background:var(--primary);
}

/* ---------------- 弹层 ---------------- */
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-mask{position:absolute;inset:0;background:rgba(24,22,20,.42);animation:fade .2s ease}
.sheet-body{
  position:relative;width:100%;max-width:520px;
  background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px var(--pad) calc(20px + var(--safe-b));
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:up .26s cubic-bezier(.2,.8,.3,1);
  box-shadow:var(--shadow-2);
}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:6px auto 14px}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-hd h3{font-size:17px;font-weight:700}
.sheet-hd .sb-x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2)}
.sheet-hd .sb-x .ic{width:17px;height:17px}
.sheet-body .field{margin-bottom:12px}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 图片预览 */
.viewer{position:fixed;inset:0;z-index:100;background:rgba(16,15,14,.94);display:grid;place-items:center;padding:16px}
.viewer img{max-width:100%;max-height:86vh;border-radius:12px;display:block}
.viewer .v-x{position:absolute;top:calc(16px + var(--safe-t));right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}

/* ---------------- 提示 ----------------*/
.toast{
  position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);
  z-index:120;max-width:calc(100% - 40px);
  background:rgba(28,26,24,.94);color:#fff;
  padding:11px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;line-height:1.4;text-align:center;
  animation:fade .16s ease;box-shadow:var(--shadow-2);
}
.toast[hidden]{display:none}

/* 启动遮罩 */
.boot{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-size:13.5px;color:var(--muted);font-weight:600;
}
.boot[hidden]{display:none}
.boot-dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--primary-line);border-top-color:var(--primary);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 危险区 */
.danger-zone{border-color:#F0DCD5}
.danger-zone .card-hd .ic-badge{background:var(--bad-soft);color:var(--bad)}

/* 工具类 */
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}

/* 「我的」页底部：存储引擎说明（本地数据库 or 简易存储） */
.store-note{display:flex;gap:8px;align-items:flex-start;margin:4px 2px 22px;padding:10px 12px;
  border-radius:var(--r-md);background:var(--primary-soft);border:1px solid var(--primary-line);
  color:var(--text-2);font-size:12px;line-height:1.6}
.store-note b{color:var(--primary);font-weight:600}
.store-note .sn-ic{flex:none;display:grid;place-items:center;margin-top:1px;color:var(--primary)}
.store-note .sn-ic .ic{width:15px;height:15px}
.store-note .sn-tx{flex:1;min-width:0}
.store-note-warn{background:var(--bad-soft);border-color:#EBCBBF;color:#7E3620}
.store-note-warn b{color:var(--bad)}
.store-note-warn .sn-ic{color:var(--bad)}
.store-note .sn-sub{margin-top:6px;color:var(--muted)}
.store-note .sn-sub b{color:inherit;font-weight:700}
.store-note-warn .sn-sub{color:#7E3620}
.store-note .sn-sub .lnk{margin-left:4px;vertical-align:baseline}
.store-note .sn-acts{display:flex;gap:8px;margin-top:10px}
.store-note .sn-acts .btn{flex:1;min-width:0}

/* 云端备份卡：手机号 + 验证码一行放得下，且都 >= 44px 好点 */
.code-row{display:flex;gap:8px;align-items:flex-start}
.code-row .inp{flex:1;min-width:0}
.btn-code{flex:none;white-space:nowrap;min-height:var(--tap);padding:0 12px;font-size:13.5px}
.btn-code:disabled{opacity:.55}
.field-err{color:var(--bad);font-size:12px;font-weight:600;line-height:1.5;margin-top:4px}
.field-err:empty{display:none}
.io-mini .lnk .ic{width:15px;height:15px;vertical-align:-2px;margin-right:5px;color:var(--primary)}
#cloudCard .kv{margin:2px 0 6px}
.tag-soft{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;color:var(--primary);
  background:var(--primary-soft);padding:3px 9px;border-radius:999px;
}
.tag-soft.warn{color:var(--warn);background:var(--warn-soft)}
.tag-soft.accent{color:var(--accent);background:var(--accent-soft)}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:12px;color:var(--muted)}

/* 导出卡里的一行小字入口 */
.io-mini{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:4px;flex-wrap:wrap;
}
.io-mini .lnk{
  background:none;border:0;min-height:40px;padding:0 4px;
  font-size:13px;font-weight:600;color:var(--primary);
  text-decoration:underline;text-underline-offset:3px;
}
.io-mini .lnk:active{opacity:.6}
.io-mini .dot-sep{color:var(--line-strong);font-size:12px}

@media (min-width:560px){
  body{background:var(--bg-deep)}
  .tabbar{background:rgba(251,249,246,.94)}
  .view,.tb-inner,.tabbar-inner{max-width:480px}
}

<script>
/* ===========================================================
   util.js —— 日期 / 数字 / DOM 小工具（无依赖）
   =========================================================== */
(function (w) {
  'use strict';

  /* ---------- 日期 ---------- */
  var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /** 本地日期 → 'YYYY-MM-DD'（不用 toISOString，避免时区偏移） */
  function toKey(d) {
    if (typeof d === 'string') return d.slice(0, 10);
    if (!d) d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** 'YYYY-MM-DD' → Date（本地 00:00） */
  function fromKey(key) {
    var p = String(key).split('-');
    return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }

  function today() { return toKey(new Date()); }

  function isKey(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

  function addDays(key, n) {
    var d = fromKey(key);
    d.setDate(d.getDate() + n);
    return toKey(d);
  }

  /** 包含首尾的自然日差（b - a） */
  function diffDays(a, b) {
    var ms = fromKey(b).getTime() - fromKey(a).getTime();
    return Math.round(ms / 86400000);
  }

  function weekdayCN(key) { return WEEK_CN[fromKey(key).getDay()]; }

  /** '10-16' 或 '2026-10-16' → '10月16日 周四' */
  function label(key, withYear) {
    var d = fromKey(key);
    var s = (withYear ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return s + ' 周' + WEEK_CN[d.getDay()];
  }

  /** 相对今天的口语化描述 */
  function relDay(key) {
    var n = diffDays(today(), key);
    if (n === 0) return '今天';
    if (n === -1) return '昨天';
    if (n === 1) return '明天';
    if (n === -2) return '前天';
    return label(key, false);
  }

  /* ---------- 数字 ---------- */
  function isNum(v) { return v !== null && v !== undefined && v !== '' && isFinite(Number(v)); }
  function num(v, fb) { return isNum(v) ? Number(v) : (fb === undefined ? null : fb); }
  function round(v, n) {
    if (!isNum(v)) return null;
    var p = Math.pow(10, n === undefined ? 1 : n);
    return Math.round(Number(v) * p) / p;
  }
  /** 去掉多余小数尾巴：7.50 → 7.5；7.00 → 7 */
  function nice(v, n) {
    var r = round(v, n === undefined ? 1 : n);
    if (r === null) return '—';
    return String(+r.toFixed(n === undefined ? 1 : n));
  }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function sum(arr) { return arr.reduce(function (a, b) { return a + (isNum(b) ? Number(b) : 0); }, 0); }
  function avg(arr) {
    var v = arr.filter(isNum);
    return v.length ? sum(v) / v.length : null;
  }
  function median(arr) {
    var v = arr.filter(isNum).map(Number).sort(function (a, b) { return a - b; });
    if (!v.length) return null;
    var m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  }

  /* ---------- 计算 ---------- */
  /** 'HH:MM' → 分钟数 */
  function hm2min(t) {
    if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
    var p = t.split(':');
    return (+p[0]) * 60 + (+p[1]);
  }
  /**
   * 入睡 / 起床 → 睡眠小时数（跨夜自动 +24h）
   * 例：23:30 → 07:00 = 7.5
   */
  function sleepHours(start, end) {
    var a = hm2min(start), b = hm2min(end);
    if (a === null || b === null) return null;
    var m = b - a;
    if (m <= 0) m += 1440;
    if (m > 1440) m = null;
    return m === null ? null : Math.round((m / 60) * 100) / 100;
  }
  /** 由时长反推起床时间（用于只填了入睡+时长） */
  function endFromHours(start, hours) {
    var a = hm2min(start);
    if (a === null || !isNum(hours)) return '';
    var m = (a + Math.round(Number(hours) * 60)) % 1440;
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }

  function bmi(kg, cm) {
    if (!isNum(kg) || !isNum(cm) || Number(cm) <= 0) return null;
    var m = Number(cm) / 100;
    return Math.round((Number(kg) / (m * m)) * 10) / 10;
  }
  function bmiTag(v) {
    if (v === null) return null;
    if (v < 18.5) return { t: '偏瘦', tone: 'warn' };
    if (v < 24) return { t: '正常', tone: 'good' };
    if (v < 28) return { t: '超重', tone: 'accent' };
    return { t: '肥胖', tone: 'accent' };
  }

  /* ---------- DOM ---------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /** 属性值转义（用于 value="..." 等） */
  function attr(v) { return esc(v); }

  var _t = null;
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(_t);
    _t = setTimeout(function () { el.hidden = true; }, ms || 1900);
  }

  function debounce(fn, wait) {
    var t = null;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, wait || 400);
    };
  }

  function toastHide() {
    var el = document.getElementById('toast');
    if (el) el.hidden = true;
    clearTimeout(_t);
  }

  /** 触发浏览器下载 */
  function download(filename, content, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1200);
  }

  /** dataURL → 估测字节数 */
  function dataUrlBytes(u) {
    if (!u || typeof u !== 'string') return 0;
    var i = u.indexOf(',');
    if (i < 0) return 0;
    return Math.round((u.length - i - 1) * 0.75);
  }
  function fmtBytes(b) {
    if (!b) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }

  w.U = {
    WEEK_CN: WEEK_CN, pad: pad, toKey: toKey, fromKey: fromKey, today: today, isKey: isKey,
    addDays: addDays, diffDays: diffDays, weekdayCN: weekdayCN, label: label, relDay: relDay,
    isNum: isNum, num: num, round: round, nice: nice, clamp: clamp, sum: sum, avg: avg, median: median,
    hm2min: hm2min, sleepHours: sleepHours, endFromHours: endFromHours, bmi: bmi, bmiTag: bmiTag,
    esc: esc, qs: qs, qsa: qsa, attr: attr, toast: toast, toastHide: toastHide, debounce: debounce,
    download: download, dataUrlBytes: dataUrlBytes, fmtBytes: fmtBytes
  };
})(window);

</script>
<script>
/* ===========================================================
   db.js —— 数据层
   首选 IndexedDB（真正的本地数据库：days 记录 / photos 图片 / meta 设置）
   只有在确实拿不到 IndexedDB 时，才降级 localStorage（简易存储）并显式告警
   =========================================================== */
(function (w) {
  'use strict';

  var DB_NAME = 'qingji';
  var DB_VER = 1;
  var LS_PREFIX = 'qj:';

  var _db = null;
  var _mode = 'idb';           // 'idb' | 'ls'
  var _ls = {};                // 降级模式下的内存镜像
  var _conflict = {};          // 名字冲突时被拒绝的请求
  var _openError = null;       // IndexedDB 打不开时的原始错误（用于告知用户）
  var _persist = 'unknown';    // 'granted' | 'denied' | 'unsupported' | 'unknown'
  var _quota = null;           // { usage, quota }

  /* ============ IndexedDB 基础封装 ============ */
  function req(r) {
    return new Promise(function (resolve, reject) {
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error || new Error('IDB request failed')); };
    });
  }

  function tx(stores, mode, fn) {
    return new Promise(function (resolve, reject) {
      var t = _db.transaction(stores, mode);
      var out;
      t.oncomplete = function () { resolve(out); };
      t.onerror = function () { reject(t.error || new Error('IDB tx failed')); };
      t.onabort = function () { reject(t.error || new Error('IDB tx aborted')); };
      out = fn(t);
    });
  }

  /* ============ 环境诊断：把「为什么拿不到数据库」变成可读信息 ============ */
  function inIframe() {
    try { return w.self !== w.top; } catch (e) { return true; }   // 跨域访问 top 抛错 = 一定在 iframe 里
  }

  function diagnose() {
    var e = _openError;
    return {
      hasIDB: !!w.indexedDB,
      inIframe: inIframe(),
      sandboxed: inIframe() && !w.indexedDB,      // 典型的 <iframe sandbox> 无 same-origin 场景
      secure: (function () { try { return !!w.isSecureContext; } catch (x) { return false; } })(),
      errName: e ? String(e.name || '') : '',
      errMsg: e ? String(e.message || e) : '',
      /** 给界面用的中文原因 */
      reason: (function () {
        if (!e) return '';
        var n = String(e.name || '');
        var proto = '';
        try { proto = location.protocol; } catch (x) { proto = ''; }
        if (inIframe() && !w.indexedDB) return '页面被嵌在受限的预览窗口里，浏览器拒绝提供本地数据库';
        if (proto === 'file:') return '页面是以「本地文件」方式直接打开的（地址栏是 file:// 开头）。浏览器在这个模式下不提供本地数据库，请通过网址（https://）打开，或在本机起一个本地服务器';
        if (n === 'SecurityError') return '浏览器安全策略拒绝了本地数据库（常见于无痕模式或受限的页面容器）';
        if (n === 'QuotaExceededError') return '磁盘配额不足，无法建立本地数据库';
        if (n === 'InvalidStateError' || n === 'VersionError') return '本地数据库版本冲突，可能另一个标签页正开着旧版页面';
        if (!w.indexedDB) return '这个浏览器不支持本地数据库（通常是无痕窗口或极旧版本）';
        return String(e.message || e);
      })()
    };
  }

  /* ============ 持久存储：让浏览器「不要自动清理」 ============ */
  async function requestPersist() {
    try {
      if (!w.navigator || !navigator.storage || !navigator.storage.persist) {
        _persist = 'unsupported';
        return _persist;
      }
      if (navigator.storage.persisted) {
        var already = await navigator.storage.persisted();
        if (already) { _persist = 'granted'; return _persist; }
      }
      var ok = await navigator.storage.persist();
      _persist = ok ? 'granted' : 'denied';
    } catch (e) { _persist = 'unsupported'; }
    return _persist;
  }

  async function readQuota() {
    try {
      if (!w.navigator || !navigator.storage || !navigator.storage.estimate) { _quota = null; return null; }
      var est = await navigator.storage.estimate();
      _quota = { usage: est.usage || 0, quota: est.quota || 0 };
    } catch (e) { _quota = null; }
    return _quota;
  }

  function openIDB() {
    return new Promise(function (resolve, reject) {
      var r;
      try { r = indexedDB.open(DB_NAME, DB_VER); }
      catch (e) { return reject(e); }

      r.onupgradeneeded = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains('days')) db.createObjectStore('days', { keyPath: 'date' });
        if (!db.objectStoreNames.contains('photos')) {
          var ps = db.createObjectStore('photos', { keyPath: 'id' });
          ps.createIndex('date', 'date', { unique: false });
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error || new Error('indexedDB open failed')); };
      // 被另一个标签页占着旧连接时不立刻判死：等一会儿，多半会自己放行
      r.onblocked = function () {
        if (r.__waited) return;
        r.__waited = true;
        setTimeout(function () {
          var err = new Error('本地数据库被其他标签页占用，请关掉其它「轻记」页面后重试');
          err.name = 'BlockedError';
          reject(err);
        }, 2600);
      };
    });
  }

  /* ============ localStorage 降级 ============ */
  function lsLoad() {
    ['days', 'photos', 'meta'].forEach(function (k) {
      try {
        _ls[k] = JSON.parse(localStorage.getItem(LS_PREFIX + k) || (k === 'meta' ? '{}' : '{}')) || {};
      } catch (e) { _ls[k] = {}; }
    });
  }
  function lsSave(k) {
    try {
      localStorage.setItem(LS_PREFIX + k, JSON.stringify(_ls[k]));
      return true;
    } catch (e) {
      // 配额爆掉：把刚写进去的东西撤了，避免内存与磁盘不一致
      _conflict[k] = true;
      return false;
    }
  }

  /* ============ 公共 API ============ */
  var API = {
    get mode() { return _mode; },
    /** 真·本地数据库？false 表示退到了简易存储 */
    get isIndexedDB() { return _mode === 'idb' && !!_db; },
    /** 给界面用的一句人话 */
    get storageLabel() { return _mode === 'idb' ? '本地数据库（IndexedDB）' : '简易存储（localStorage）'; },
    get dbName() { return DB_NAME; },
    get storeNames() {
      if (_mode !== 'idb' || !_db) return [];
      var out = [];
      for (var i = 0; i < _db.objectStoreNames.length; i++) out.push(_db.objectStoreNames[i]);
      return out;
    },
    get openError() { return _openError ? String(_openError.message || _openError) : null; },
    get lastQuotaError() { return !!_conflict.photos || !!_conflict.days; },

    /** 'granted' | 'denied' | 'unsupported' | 'unknown' —— 浏览器是否承诺不自动清理本应用数据 */
    get persistence() { return _persist; },
    /** 只要持久化被拒/不支持，就存在「被浏览器自动清理」的风险 */
    get protectedFromEviction() { return _mode === 'idb' && _persist === 'granted'; },
    get quota() { return _quota; },
    diag: diagnose,
    requestPersist: requestPersist,
    readQuota: readQuota,

    async init() {
      // IndexedDB 是首选且是「本地数据库」。
      // 若浏览器根本没有这个接口（无痕模式/受限容器/极旧内核），重试没有意义，直接降级；
      // 只有在「接口在、但这次没打开成功」时才重试，避免个别浏览器首次被拒就误判成不支持。
      if (!w.indexedDB) {
        var ne = new Error('浏览器未提供本地数据库接口（indexedDB）');
        ne.name = 'UnsupportedError';
        _openError = ne;
      } else {
        for (var attempt = 0; attempt < 2; attempt++) {
          try {
            _db = await openIDB();
            _mode = 'idb';
            _openError = null;
            // 拿到数据库后，申请「持久存储」——这是防止被浏览器自动清空的关键一步
            try { await requestPersist(); } catch (e2) {}
            try { await readQuota(); } catch (e3) {}
            return _mode;
          } catch (e) {
            _openError = e;
            _db = null;
            if (attempt === 0) await new Promise(function (r) { setTimeout(r, 200); });
          }
        }
      }
      // 退到简易存储（并如实告警）
      _mode = 'ls';
      _db = null;
      lsLoad();
      // 降级模式下也尽力申请持久化，能挡住一部分自动清理
      try { await requestPersist(); } catch (e4) {}
      try { await readQuota(); } catch (e5) {}
      return _mode;
    },

    /* ---------- 每日记录 ---------- */
    async allDays() {
      if (_mode === 'idb') {
        return await tx(['days'], 'readonly', function (t) {
          var out = {};
          t.objectStore('days').openCursor().onsuccess = function (e) {
            var c = e.target.result;
            if (c) { out[c.value.date] = c.value; c.continue(); }
          };
          return out;
        });
      }
      return JSON.parse(JSON.stringify(_ls.days));
    },

    async getDay(date) {
      if (_mode === 'idb') {
        var v = await req(_db.transaction('days', 'readonly').objectStore('days').get(date));
        return v || null;
      }
      return _ls.days[date] ? JSON.parse(JSON.stringify(_ls.days[date])) : null;
    },

    async putDay(day) {
      day.updatedAt = Date.now();
      if (_mode === 'idb') {
        await tx(['days'], 'readwrite', function (t) { t.objectStore('days').put(day); });
        return true;
      }
      _ls.days[day.date] = day;
      return lsSave('days');
    },

    async deleteDay(date) {
      if (_mode === 'idb') {
        await tx(['days', 'photos'], 'readwrite', function (t) {
          t.objectStore('days').delete(date);
          var idx = t.objectStore('photos').index('date');
          idx.openCursor(IDBKeyRange.only(date)).onsuccess = function (e) {
            var c = e.target.result;
            if (c) { c.delete(); c.continue(); }
          };
        });
        return true;
      }
      delete _ls.days[date];
      Object.keys(_ls.photos).forEach(function (id) {
        if (_ls.photos[id].date === date) delete _ls.photos[id];
      });
      lsSave('days'); lsSave('photos');
      return true;
    },

    /* ---------- 图片 ---------- */
    async addPhoto(p) {
      if (_mode === 'idb') {
        await tx(['photos'], 'readwrite', function (t) { t.objectStore('photos').put(p); });
        return true;
      }
      _ls.photos[p.id] = p;
      if (!lsSave('photos')) {
        delete _ls.photos[p.id];
        return false;   // 配额不足
      }
      return true;
    },

    async photosOf(date) {
      if (_mode === 'idb') {
        return await tx(['photos'], 'readonly', function (t) {
          var out = [];
          t.objectStore('photos').index('date').openCursor(IDBKeyRange.only(date)).onsuccess = function (e) {
            var c = e.target.result;
            if (c) { out.push(c.value); c.continue(); }
          };
          return out;
        });
      }
      return Object.keys(_ls.photos).map(function (k) { return _ls.photos[k]; })
        .filter(function (p) { return p.date === date; })
        .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    },

    async allPhotos() {
      if (_mode === 'idb') {
        return await tx(['photos'], 'readonly', function (t) {
          var out = [];
          t.objectStore('photos').openCursor().onsuccess = function (e) {
            var c = e.target.result;
            if (c) { out.push(c.value); c.continue(); }
          };
          return out;
        });
      }
      var self = this;
      return Object.keys(_ls.photos).map(function (k) { return _ls.photos[k]; });
    },

    async deletePhoto(id) {
      if (_mode === 'idb') {
        await tx(['photos'], 'readwrite', function (t) { t.objectStore('photos').delete(id); });
        return true;
      }
      delete _ls.photos[id];
      lsSave('photos');
      return true;
    },

    /** 只数张数，不把 base64 全读进内存 */
    async countPhotos() {
      if (_mode === 'idb') {
        return await tx(['photos'], 'readonly', function (t) {
          var box = { n: 0 };
          t.objectStore('photos').count().onsuccess = function (e) { box.n = e.target.result; };
          return box;
        }).then(function (b) { return b.n; });
      }
      return Object.keys(_ls.photos).length;
    },

    /* ---------- meta ---------- */
    async getMeta(k, fallback) {
      if (_mode === 'idb') {
        var v = await req(_db.transaction('meta', 'readonly').objectStore('meta').get(k));
        return v ? v.v : (fallback === undefined ? null : fallback);
      }
      return _ls.meta[k] ? _ls.meta[k].v : (fallback === undefined ? null : fallback);
    },

    async setMeta(k, v) {
      if (_mode === 'idb') {
        await tx(['meta'], 'readwrite', function (t) { t.objectStore('meta').put({ k: k, v: v }); });
        return true;
      }
      _ls.meta[k] = { k: k, v: v };
      return lsSave('meta');
    },

    /* ---------- 维护 ---------- */
    async estimate() {
      var days = await this.allDays();
      var photos = await this.allPhotos();
      var bytes = 0;
      photos.forEach(function (p) { bytes += (p.dataUrl || '').length; });
      bytes += JSON.stringify(days).length;
      return { days: Object.keys(days).length, photos: photos.length, bytes: bytes };
    },

    async clearAll() {
      if (_mode === 'idb') {
        await tx(['days', 'photos', 'meta'], 'readwrite', function (t) {
          t.objectStore('days').clear();
          t.objectStore('photos').clear();
          t.objectStore('meta').clear();
        });
        return true;
      }
      _ls = { days: {}, photos: {}, meta: {} };
      lsSave('days'); lsSave('photos'); lsSave('meta');
      return true;
    },

    /** 导入：{ days:{}, photos:[], settings:{} }，mode='merge'|'replace' */
    async importAll(payload, mode) {
      var days = payload.days || {};
      var photos = payload.photos || [];
      if (mode === 'replace') await this.clearAll();

      var okDays = 0, okPhotos = 0, failPhotos = 0;
      var list = Object.keys(days).map(function (k) { return days[k]; });
      if (_mode === 'idb') {
        await tx(['days'], 'readwrite', function (t) {
          var st = t.objectStore('days');
          list.forEach(function (d) { st.put(d); okDays++; });
        });
        for (var i = 0; i < photos.length; i++) {
          try { await this.addPhoto(photos[i]); okPhotos++; }
          catch (e) { failPhotos++; }
        }
      } else {
        list.forEach(function (d) { _ls.days[d.date] = d; okDays++; });
        lsSave('days');
        photos.forEach(function (p) { _ls.photos[p.id] = p; });
        if (lsSave('photos')) okPhotos = photos.length; else failPhotos = photos.length;
      }
      if (payload.settings) await this.setMeta('settings', payload.settings);
      return { days: okDays, photos: okPhotos, failPhotos: failPhotos };
    }
  };

  w.DB = API;
})(window);

</script>
<script>
/* ===========================================================
   charts.js —— 手写 SVG 图表（无第三方依赖，离线可用）
   =========================================================== */
(function (w) {
  'use strict';

  var VBW = 340;                 // viewBox 宽度，靠 width:100% 自适应
  var PAD = { l: 36, r: 12, t: 14, b: 22 };

  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function niceRange(min, max) {
    if (min === max) { var d = Math.abs(min) * 0.02 || 1; min -= d; max += d; }
    var span = max - min;
    var pad = span * 0.12;
    return { lo: min - pad, hi: max + pad };
  }

  function ticks(lo, hi, n) {
    var out = [];
    for (var i = 0; i <= n; i++) out.push(lo + (hi - lo) * (i / n));
    return out;
  }

  function fmtNum(v, d) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
    return String(+r.toFixed(d));
  }

  /**
   * 折线图
   * cfg = { pts:[{d:'YYYY-MM-DD', v:number}], unit, height, color, goal:{v,label,color},
   *         avg7:boolean, decimals }
   */
  function line(cfg) {
    var pts = (cfg.pts || []).filter(function (p) { return p.v !== null && p.v !== undefined && isFinite(p.v); });
    var H = cfg.height || 170;
    var W = VBW;
    var c = cfg.color || '#1F5F4B';
    var dec = cfg.decimals === undefined ? 1 : cfg.decimals;

    if (!pts.length) return '<div class="chart-empty">还没有数据，先去「今日」记一笔</div>';

    var vals = pts.map(function (p) { return p.v; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (cfg.goal && isFinite(cfg.goal.v)) { lo = Math.min(lo, cfg.goal.v); hi = Math.max(hi, cfg.goal.v); }
    var R = niceRange(lo, hi);

    var innerW = W - PAD.l - PAD.r;
    var innerH = H - PAD.t - PAD.b;

    // 真实日期比例映射
    var t0 = Date.parse(pts[0].d + 'T00:00:00');
    var t1 = Date.parse(pts[pts.length - 1].d + 'T00:00:00');
    var span = t1 - t0;
    function X(p, i) {
      if (span <= 0) return PAD.l + innerW / 2;
      return PAD.l + innerW * ((Date.parse(p.d + 'T00:00:00') - t0) / span);
    }
    function Y(v) { return PAD.t + innerH - innerH * ((v - R.lo) / (R.hi - R.lo)); }

    var s = [];
    s.push('<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">');

    // 网格 + y 轴标签
    var tk = ticks(R.lo, R.hi, 3);
    tk.forEach(function (v) {
      var y = Y(v);
      s.push('<line x1="' + PAD.l + '" y1="' + y.toFixed(1) + '" x2="' + (W - PAD.r) + '" y2="' + y.toFixed(1) +
        '" stroke="#EDE8E0" stroke-width="1"/>');
      s.push('<text x="' + (PAD.l - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(fmtNum(v, dec)) + '</text>');
    });

    // 目标线
    if (cfg.goal && isFinite(cfg.goal.v)) {
      var gy = Y(cfg.goal.v);
      s.push('<line x1="' + PAD.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PAD.r) + '" y2="' + gy.toFixed(1) +
        '" stroke="' + (cfg.goal.color || '#DE6B32') + '" stroke-width="1.4" stroke-dasharray="5 4" opacity=".85"/>');
      s.push('<text x="' + (W - PAD.r) + '" y="' + (gy - 5).toFixed(1) + '" text-anchor="end" fill="' + (cfg.goal.color || '#DE6B32') + '" font-weight="700">目标 ' +
        esc(cfg.goal.label || fmtNum(cfg.goal.v, dec)) + '</text>');
    }

    // 面积
    if (pts.length > 1) {
      var area = 'M' + X(pts[0], 0).toFixed(1) + ',' + (PAD.t + innerH).toFixed(1);
      pts.forEach(function (p, i) { area += 'L' + X(p, i).toFixed(1) + ',' + Y(p.v).toFixed(1); });
      area += 'L' + X(pts[pts.length - 1], pts.length - 1).toFixed(1) + ',' + (PAD.t + innerH).toFixed(1) + 'Z';
      s.push('<path d="' + area + '" fill="' + c + '" opacity=".07"/>');
    }

    // 7 日平均（需要 >= 5 个点才有意义）
    if (cfg.avg7 && pts.length >= 5) {
      var lw = [];
      for (var i = 0; i < pts.length; i++) {
        var win = pts.slice(Math.max(0, i - 6), i + 1).map(function (p) { return p.v; });
        var m = win.reduce(function (a, b) { return a + b; }, 0) / win.length;
        lw.push({ d: pts[i].d, v: m, i: i });
      }
      s.push('<polyline fill="none" stroke="#B9A88F" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round" points="' +
        lw.map(function (p) { return X(p, p.i).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '"/>');
    }

    // 主折线
    if (pts.length > 1) {
      s.push('<polyline fill="none" stroke="' + c + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="' +
        pts.map(function (p, i) { return X(p, i).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '"/>');
    }

    // 点
    var step = pts.length > 45 ? Math.ceil(pts.length / 45) : 1;
    pts.forEach(function (p, i) {
      var last = i === pts.length - 1;
      if (!last && i % step !== 0) return;
      s.push('<circle cx="' + X(p, i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (last ? 4 : 2.6) +
        '" fill="' + (last ? c : '#fff') + '" stroke="' + c + '" stroke-width="' + (last ? 2 : 1.6) + '"/>');
    });

    // x 轴日期标签（首 / 中 / 末）
    var marks = pts.length === 1 ? [0] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    marks.forEach(function (i, k) {
      var anchor = marks.length === 1 ? 'middle' : (k === 0 ? 'start' : (k === marks.length - 1 ? 'end' : 'middle'));
      var xx = X(pts[i], i);
      if (marks.length === 3 && k === 0) xx = PAD.l;
      if (marks.length === 3 && k === 2) xx = W - PAD.r;
      s.push('<text x="' + xx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">' +
        esc(pts[i].d.slice(5).replace('-', '/')) + '</text>');
    });

    // 最新值气泡
    var lastP = pts[pts.length - 1];
    var lx = X(lastP, pts.length - 1), ly = Y(lastP.v);
    var label = fmtNum(lastP.v, dec) + (cfg.unit || '');
    var bw = label.length * 6.4 + 12;
    var bx = Math.min(Math.max(lx - bw / 2, PAD.l), W - PAD.r - bw);
    var by = Math.max(ly - 26, 2);
    s.push('<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="17" rx="8.5" fill="' + c + '"/>');
    s.push('<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (by + 12).toFixed(1) + '" text-anchor="middle" fill="#fff" font-weight="700" style="font-size:10.5px">' + esc(label) + '</text>');

    s.push('</svg>');
    return s.join('');
  }

  /**
   * 柱状图（等距柱子，取最近 N 条）
   * cfg = { pts:[{d,v}], height, color, unit, decimals, goal:{v} }
   */
  function bar(cfg) {
    var pts = (cfg.pts || []).filter(function (p) { return p.v !== null && p.v !== undefined && isFinite(p.v); });
    var H = cfg.height || 150;
    var W = VBW;
    var c = cfg.color || '#1F5F4B';
    var dec = cfg.decimals === undefined ? 0 : cfg.decimals;
    var limit = cfg.limit || 30;

    if (!pts.length) return '<div class="chart-empty">还没有数据</div>';
    if (pts.length > limit) pts = pts.slice(pts.length - limit);

    var vals = pts.map(function (p) { return p.v; });
    var hi = Math.max.apply(null, vals);
    if (cfg.goal && isFinite(cfg.goal.v)) hi = Math.max(hi, cfg.goal.v);
    hi = hi * 1.15 || 1;

    var innerW = W - PAD.l - PAD.r;
    var innerH = H - PAD.t - PAD.b;
    var slot = innerW / pts.length;
    var bw = Math.max(3, Math.min(slot * 0.68, 16));

    function Y(v) { return PAD.t + innerH - innerH * (v / hi); }

    var s = [];
    s.push('<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">');

    ticks(0, hi, 3).forEach(function (v) {
      var y = Y(v);
      s.push('<line x1="' + PAD.l + '" y1="' + y.toFixed(1) + '" x2="' + (W - PAD.r) + '" y2="' + y.toFixed(1) + '" stroke="#EDE8E0" stroke-width="1"/>');
      s.push('<text x="' + (PAD.l - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(fmtNum(v, dec)) + '</text>');
    });

    if (cfg.goal && isFinite(cfg.goal.v)) {
      var gy = Y(cfg.goal.v);
      s.push('<line x1="' + PAD.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PAD.r) + '" y2="' + gy.toFixed(1) +
        '" stroke="' + (cfg.goal.color || '#DE6B32') + '" stroke-width="1.4" stroke-dasharray="5 4"/>');
    }

    pts.forEach(function (p, i) {
      var x = PAD.l + slot * i + (slot - bw) / 2;
      var y = Y(p.v);
      var h = Math.max(2, PAD.t + innerH - y);
      var last = i === pts.length - 1;
      s.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="' + Math.min(3, bw / 2).toFixed(1) + '" fill="' + c + '" opacity="' + (last ? 1 : 0.45) + '"' +
        (last ? ' stroke="' + c + '" stroke-width="1"' : '') + '/>');
    });

    // 末值标签
    var lastP = pts[pts.length - 1];
    var lb = fmtNum(lastP.v, dec) + (cfg.unit || '');
    var txc = PAD.l + slot * (pts.length - 1) + slot / 2;
    s.push('<text x="' + U.clamp(txc, PAD.l + 16, W - PAD.r - 16).toFixed(1) + '" y="' + (Y(lastP.v) - 6).toFixed(1) +
      '" text-anchor="middle" fill="' + c + '" font-weight="700" style="font-size:10.5px">' + esc(lb) + '</text>');

    [0, pts.length - 1].forEach(function (i, k) {
      s.push('<text x="' + (k === 0 ? PAD.l : W - PAD.r).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (k === 0 ? 'start' : 'end') + '">' +
        esc(pts[i].d.slice(5).replace('-', '/')) + '</text>');
    });

    s.push('</svg>');
    return s.join('');
  }

  w.Charts = { line: line, bar: bar };
})(window);

</script>
<script>
/* ===========================================================
   xlsx.js —— 纯前端生成真正的 .xlsx（零依赖）
   手写最小 OOXML 包 + ZIP(store) 容器
   Excel / WPS / Numbers / Google Sheets 均可直接打开
   =========================================================== */
(function (w) {
  'use strict';

  /* ---------------- CRC32 ---------------- */
  var CRCT = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* UTF-8 编码（TextEncoder 不可用时手写兜底） */
  function utf8(s) {
    if (w.TextEncoder) return new w.TextEncoder().encode(s);
    var out = [], i, c;
    for (i = 0; i < s.length; i++) {
      c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0xD800 || c >= 0xE000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else {
        i++;
        c = 0x10000 + (((c & 0x3FF) << 10) | (s.charCodeAt(i) & 0x3FF));
        out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      }
    }
    return new Uint8Array(out);
  }

  /* ---------------- ZIP 容器（store，不压缩） ---------------- */
  function zip(files) {
    var parts = [], central = [], offset = 0;

    files.forEach(function (f) {
      var name = utf8(f.name);
      var data = f.data;
      var crc = crc32(data);
      var size = data.length;

      var lh = new Uint8Array(30 + name.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);        // local file header
      dv.setUint16(4, 20, true);                // version needed
      dv.setUint16(6, 0x0800, true);            // 文件名按 UTF-8 解
      dv.setUint16(8, 0, true);                 // 压缩方式 store
      dv.setUint16(10, 0, true);                // 时间
      dv.setUint16(12, 0x21, true);             // 日期：1980-01-01
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, name.length, true);
      dv.setUint16(28, 0, true);
      lh.set(name, 30);
      parts.push(lh, data);

      var ch = new Uint8Array(46 + name.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);        // central directory header
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x21, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + size;
    });

    var cdSize = 0;
    central.forEach(function (c) { cdSize += c.length; });

    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);          // end of central directory
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob(parts.concat(central, [eocd]), {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
  }

  /* ---------------- XML 片段 ---------------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  /** 1 → A，27 → AA */
  function colName(n) {
    var s = '';
    while (n > 0) {
      var m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function cell(ref, v, style) {
    if (v === null || v === undefined || v === '') return '';
    var st = style ? ' s="' + style + '"' : '';
    if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + st + '><v>' + v + '</v></c>';
    return '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
  }

  function sheetXml(sheet) {
    var rows = sheet.rows || [];

    var body = rows.map(function (row, i) {
      var r = i + 1, cells = '';
      for (var j = 0; j < row.length; j++) cells += cell(colName(j + 1) + r, row[j], i === 0 ? 1 : 0);
      return '<row r="' + r + '">' + cells + '</row>';
    }).join('');

    var cols = '';
    if (sheet.widths && sheet.widths.length) {
      cols = '<cols>' + sheet.widths.map(function (w, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>';
    }

    var maxCol = rows.reduce(function (a, r) { return Math.max(a, r.length); }, 1);
    var dim = '<dimension ref="A1:' + colName(maxCol) + Math.max(1, rows.length) + '"/>';

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      dim +
      '<sheetViews><sheetView workbookViewId="0">' +
      (rows.length > 1 ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : '') +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      cols +
      '<sheetData>' + body + '</sheetData>' +
      '</worksheet>';
  }

  /* 表头样式：加粗 + 浅底 */
  var STYLES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2">' +
    '<font><sz val="11"/><color theme="1"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color theme="1"/><name val="Calibri"/></font>' +
    '</fonts>' +
    '<fills count="3">' +
    '<fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEAF3EF"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  var ROOT_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  function contentTypes(n) {
    var out = '';
    for (var i = 1; i <= n; i++) {
      out += '<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      out +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';
  }

  function workbookXml(sheets) {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' + sheets.map(function (s, i) {
        return '<sheet name="' + esc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
      }).join('') + '</sheets>' +
      '</workbook>';
  }

  function workbookRels(n) {
    var out = '';
    for (var i = 1; i <= n; i++) {
      out += '<Relationship Id="rId' + i + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + i + '.xml"/>';
    }
    out += '<Relationship Id="rId' + (n + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + out + '</Relationships>';
  }

  /**
   * sheets: [{ name, rows: [[..],[..]], widths: [12, 16] }]
   * 返回 Blob（.xlsx）
   */
  function build(sheets) {
    if (!sheets || !sheets.length) throw new Error('至少需要一个工作表');

    var files = [
      { name: '[Content_Types].xml', data: utf8(contentTypes(sheets.length)) },
      { name: '_rels/.rels', data: utf8(ROOT_RELS) },
      { name: 'xl/workbook.xml', data: utf8(workbookXml(sheets)) },
      { name: 'xl/_rels/workbook.xml.rels', data: utf8(workbookRels(sheets.length)) },
      { name: 'xl/styles.xml', data: utf8(STYLES) }
    ];
    sheets.forEach(function (s, i) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: utf8(sheetXml(s)) });
    });
    return zip(files);
  }

  w.Xlsx = { build: build, colName: colName };
})(window);

</script>
<script>
/* ===========================================================
   export.js —— 本地导出 / 导入
   Excel（.xlsx，真正的表格文件）· JSON 完整备份（含饮食照片）
   =========================================================== */
(function (w) {
  'use strict';

  var MOOD = { 1: '很差', 2: '偏低', 3: '一般', 4: '不错', 5: '很棒' };
  var MEALS = [['breakfast', '早餐'], ['lunch', '午餐'], ['dinner', '晚餐'], ['snack', '加餐']];

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }

  function exText(list) {
    if (!list || !list.length) return '';
    return list.map(function (e) {
      var s = (e.type || '运动');
      if (U.isNum(e.dur)) s += ' ' + U.nice(e.dur, 0) + '分钟';
      if (U.isNum(e.kcal)) s += '(' + U.nice(e.kcal, 0) + 'kcal)';
      if (e.note) s += ' ' + e.note;
      return s;
    }).join('；');
  }

  /* 兼容老数据：没有 meals[x] 或没有 time 字段时一律返回空串 */
  function mTime(meals, key) { return (meals && meals[key] && meals[key].time) || ''; }
  function mText(meals, key) { return (meals && meals[key] && meals[key].text) || ''; }

  /**
   * 全量 JSON 备份（图片以 dataURL 内嵌，单文件即可完整还原）
   */
  async function exportJSON(state) {
    var days = state.days || {};
    var photos = state.photos || [];
    var payload = {
      app: 'qingji', version: 1,
      exportedAt: new Date().toISOString(),
      settings: state.settings || {},
      days: days,
      photos: photos.map(function (p) {
        return { id: p.id, date: p.date, meal: p.meal, createdAt: p.createdAt, dataUrl: p.dataUrl };
      })
    };
    var json = JSON.stringify(payload);
    U.download('轻记备份-' + stamp() + '.json', json, 'application/json;charset=utf-8');
    return { bytes: json.length, days: Object.keys(days).length, photos: photos.length };
  }

  /**
   * Excel（.xlsx）：两个工作表
   *   ① 每日记录 —— 一天一行，含每餐就餐时间
   *   ② 运动明细 —— 一条运动一行
   */
  function exportXLSX(state) {
    var days = state.days || {};
    var keys = Object.keys(days).sort();
    var H = U.num(state.settings && state.settings.height, null);

    var head = ['日期', '星期', '体重(kg)', '体脂率(%)', 'BMI', '入睡', '起床', '睡眠(h)', '睡眠质量',
      '步数', '运动项数', '运动时长(分钟)', '运动消耗(kcal)',
      '早餐时间', '早餐', '午餐时间', '午餐', '晚餐时间', '晚餐', '加餐时间', '加餐',
      '心情', '减肥感受'];
    var rows = [head];

    keys.forEach(function (k) {
      var d = days[k];
      var ex = d.exercises || [];
      var dur = U.sum(ex.map(function (e) { return U.num(e.dur, 0); }));
      var kcal = U.sum(ex.map(function (e) { return U.num(e.kcal, 0); }));
      var m = d.meals || {};
      var bmi = U.bmi(d.weight, H);
      rows.push([
        k, '周' + U.weekdayCN(k),
        U.isNum(d.weight) ? Number(d.weight) : '',
        U.isNum(d.bodyFat) ? Number(d.bodyFat) : '',
        bmi === null ? '' : bmi,
        d.sleepStart || '', d.sleepEnd || '',
        U.isNum(d.sleepHours) ? Number(d.sleepHours) : '',
        U.isNum(d.sleepQuality) ? Number(d.sleepQuality) : '',
        U.isNum(d.steps) ? Number(d.steps) : '',
        ex.length || '',
        dur || '', kcal || '',
        mTime(m, 'breakfast'), mText(m, 'breakfast'),
        mTime(m, 'lunch'), mText(m, 'lunch'),
        mTime(m, 'dinner'), mText(m, 'dinner'),
        mTime(m, 'snack'), mText(m, 'snack'),
        (d.feeling && d.feeling.mood) ? MOOD[d.feeling.mood] : '',
        (d.feeling && d.feeling.text) || ''
      ]);
    });

    var exRows = [['日期', '运动项目', '时长(分钟)', '消耗(kcal)', '备注']];
    keys.forEach(function (k) {
      (days[k].exercises || []).forEach(function (e) {
        exRows.push([
          k, e.type || '',
          U.isNum(e.dur) ? Number(e.dur) : '',
          U.isNum(e.kcal) ? Number(e.kcal) : '',
          e.note || ''
        ]);
      });
    });

    var blob = Xlsx.build([
      {
        name: '每日记录', rows: rows,
        widths: [12, 6, 10, 11, 8, 8, 8, 9, 10, 9, 10, 14, 14, 10, 26, 10, 26, 10, 26, 10, 26, 10, 40]
      },
      { name: '运动明细', rows: exRows, widths: [12, 26, 12, 12, 32] }
    ]);
    U.download('轻记-数据-' + stamp() + '.xlsx', blob);
    return { days: keys.length, exercises: exRows.length - 1, bytes: blob.size };
  }

  /** 读取用户选择的 JSON 文件 */
  function readJSONFile(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var obj = JSON.parse(String(fr.result));
          if (!obj || typeof obj !== 'object') throw new Error('内容不是对象');
          if (!obj.days && !obj.photos) throw new Error('缺少 days / photos 字段，可能不是轻记的备份');
          resolve(obj);
        } catch (e) { reject(e); }
      };
      fr.onerror = function () { reject(fr.error || new Error('读取失败')); };
      fr.readAsText(file);
    });
  }

  w.Export = {
    exportJSON: exportJSON, exportXLSX: exportXLSX,
    readJSONFile: readJSONFile, MOOD: MOOD, MEALS: MEALS, exText: exText
  };
})(window);

</script>
<script>
/* ===========================================================
   app.js —— 状态 / 路由 / 事件 / 图片处理
   =========================================================== */
(function (w) {
  'use strict';

  var MAX_EDGE = 1024;      // 图片压缩后最长边
  var JPEG_Q = 0.72;

  var App = {
    state: {
      tab: 'today',
      date: U.today(),
      days: {},               // { 'YYYY-MM-DD': dayObj }
      settings: {},
      photoCache: {},         // { 'YYYY-MM-DD': [photo] }
      photoCount: 0,          // 全部照片张数（用于概览统计）
      calY: 0, calM: 0,       // 日历视图年月
      trendDays: 30,
      loadingPhotos: false,
      open: {}                // 「今日」页各卡片的展开状态，如 { sleep: true, 'ph:lunch': true }
    },
    photoTarget: null,        // 当前待插入照片的 { date, meal }
    _savers: {}
  };

  /* ---------------- 数据模型 ---------------- */
  function blankDay(date) {
    return {
      date: date,
      weight: null, bodyFat: null,
      sleepStart: '', sleepEnd: '', sleepHours: null, sleepQuality: null,
      steps: null,
      exercises: [],
      meals: {
        breakfast: { text: '', time: '' }, lunch: { text: '', time: '' },
        dinner: { text: '', time: '' }, snack: { text: '', time: '' }
      },
      feeling: { mood: null, text: '' },
      updatedAt: 0
    };
  }

  /**
   * 归一化：老数据（没有 time、没有某餐次）一律补齐为空，
   * 已有内容原样保留，绝不因为加字段而丢记录。
   */
  function normalize(d) {
    var b = blankDay(d && d.date ? d.date : U.today());
    if (!d) return b;
    var o = Object.assign({}, b, d);
    var src = d.meals || {};
    o.meals = {};
    ['breakfast', 'lunch', 'dinner', 'snack'].forEach(function (m) {
      var s = src[m];
      o.meals[m] = {
        text: s && typeof s.text === 'string' ? s.text : '',
        time: s && typeof s.time === 'string' ? s.time : ''
      };
    });
    o.feeling = Object.assign({ mood: null, text: '' }, d.feeling || {});
    o.exercises = Array.isArray(d.exercises) ? d.exercises : [];
    return o;
  }

  function isEmptyDay(d) {
    if (!d) return true;
    if (U.isNum(d.weight) || U.isNum(d.bodyFat) || U.isNum(d.steps)) return false;
    if (d.sleepStart || d.sleepEnd || U.isNum(d.sleepHours) || U.isNum(d.sleepQuality)) return false;
    if ((d.exercises || []).length) return false;
    var meals = d.meals || {};
    for (var k in meals) {
      if (meals[k] && ((meals[k].text || '').trim() || meals[k].time)) return false;
    }
    if (d.feeling && ((d.feeling.text || '').trim() || U.isNum(d.feeling.mood))) return false;
    return true;
  }

  function getDay(date, create) {
    if (App.state.days[date]) return App.state.days[date];
    if (create) {
      App.state.days[date] = blankDay(date);
      return App.state.days[date];
    }
    return blankDay(date);
  }

  function sortedDates() {
    return Object.keys(App.state.days).filter(function (k) {
      return !isEmptyDay(App.state.days[k]);
    }).sort();
  }

  /** 最近一条（<= 指定日期）的体重 */
  function lastWeightBefore(date, inclusive) {
    var keys = sortedDates().filter(function (k) {
      return inclusive ? k <= date : k < date;
    });
    for (var i = keys.length - 1; i >= 0; i--) {
      if (U.isNum(App.state.days[keys[i]].weight)) return { date: keys[i], v: App.state.days[keys[i]].weight };
    }
    return null;
  }
  function firstWeight() {
    var keys = sortedDates();
    for (var i = 0; i < keys.length; i++) if (U.isNum(App.state.days[keys[i]].weight)) return App.state.days[keys[i]].weight;
    return null;
  }
  function lastWeight() {
    var keys = sortedDates();
    for (var i = keys.length - 1; i >= 0; i--) if (U.isNum(App.state.days[keys[i]].weight)) return App.state.days[keys[i]].weight;
    return null;
  }

  /* ---------------- 目标推导 ---------------- */
  function goalInfo() {
    var s = App.state.settings || {};
    var sw = U.num(s.startWeight, null);
    var tw = U.num(s.targetWeight, null);
    var start = s.startDate || null;
    var target = s.targetDate || null;
    var cur = lastWeight();
    if (cur === null) cur = sw;

    var total = (sw !== null && tw !== null) ? (sw - tw) : null;
    var done = (sw !== null && cur !== null) ? (sw - cur) : null;
    var left = (tw !== null && cur !== null) ? (cur - tw) : null;
    var daysLeft = target ? U.diffDays(U.today(), target) : null;
    var pct = (total && total > 0 && done !== null) ? U.clamp(done / total, 0, 1) : (done !== null && total !== null && total <= 0 ? 1 : null);

    var hasGoal = sw !== null && tw !== null;
    return {
      startWeight: sw, targetWeight: tw, startDate: start, targetDate: target,
      current: cur, total: total, done: done, left: left,
      daysLeft: daysLeft, pct: pct, hasGoal: hasGoal,
      onTrack: null
    };
  }

  /* ---------------- 派生：保存 ---------------- */
  function setPath(obj, path, val) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]] || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = val;
  }

  /**
   * 写入字段并落盘
   * opts = { photoCount: n } —— 有照片时即使字段为空也保留该日记录
   */
  function saveField(date, path, val, opts) {
    opts = opts || {};
    var d = getDay(date, true);
    setPath(d, path, val);
    derive(d);
    persist(date, opts);
    App.emit('data', { date: date });
  }

  function derive(d) {
    // 睡眠：入睡 + 起床 → 时长
    if (d.sleepStart && d.sleepEnd) {
      var h = U.sleepHours(d.sleepStart, d.sleepEnd);
      if (h !== null) d.sleepHours = h;
    }
  }

  var _pending = {};                 // date -> true，聚合同一日的落盘
  var _flushTimer = null;

  function persist(date, opts) {
    if (!App.state.days[date]) return;
    _pending[date] = true;
    scheduleFlush();
  }

  function scheduleFlush() {
    if (_flushTimer) return;
    _flushTimer = setTimeout(function () {
      _flushTimer = null;
      flushNow();
    }, 260);
  }

  /** 立即落盘（页面隐藏前调用，避免丢最后一次输入） */
  function flushNow() {
    var dates = Object.keys(_pending);
    _pending = {};
    dates.forEach(function (date) {
      var d = App.state.days[date];
      if (!d) return;
      // 空记录：先确认没有挂照片，再删，避免图片变成孤儿
      DB.photosOf(date).then(function (ps) {
        if (isEmptyDay(d) && (!ps || !ps.length)) {
          delete App.state.days[date];
          return DB.deleteDay(date);
        }
        return DB.putDay(JSON.parse(JSON.stringify(d)));
      }).catch(function (e) {
        U.toast('保存失败：' + (e && e.message ? e.message : '存储不可用'));
      });
    });
  }
  App.flushNow = flushNow;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushNow();
  });
  window.addEventListener('pagehide', flushNow);

  /* ---------------- 图片 ---------------- */
  function compressImage(file, maxEdge, q) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var iw = img.naturalWidth, ih = img.naturalHeight;
          var sc = Math.min(1, maxEdge / Math.max(iw, ih));
          var cw = Math.max(1, Math.round(iw * sc)), ch = Math.max(1, Math.round(ih * sc));
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          var cx = cv.getContext('2d');
          cx.fillStyle = '#fff';
          cx.fillRect(0, 0, cw, ch);
          cx.drawImage(img, 0, 0, cw, ch);
          try {
            resolve({ dataUrl: cv.toDataURL('image/jpeg', q), w: cw, h: ch });
          } catch (e) { reject(e); }
        };
        img.onerror = function () { reject(new Error('图片解析失败')); };
        img.src = String(fr.result);
      };
      fr.onerror = function () { reject(fr.error || new Error('读取失败')); };
      fr.readAsDataURL(file);
    });
  }

  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  async function addPhotos(files, target) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) {
      return f && /^image\//.test(f.type || '');
    });
    if (!list.length) { U.toast('请选择图片文件'); return 0; }
    U.toast('正在处理 ' + list.length + ' 张图片…', 60000);
    var ok = 0, fail = 0;
    for (var i = 0; i < list.length; i++) {
      try {
        var out = await compressImage(list[i], MAX_EDGE, JPEG_Q);
        var p = {
          id: uid(), date: target.date, meal: target.meal,
          dataUrl: out.dataUrl, w: out.w, h: out.h,
          createdAt: Date.now() + i
        };
        var saved = await DB.addPhoto(p);
        if (!saved) { fail++; continue; }
        (App.state.photoCache[target.date] = App.state.photoCache[target.date] || []).push(p);
        ok++;
      } catch (e) { fail++; }
    }
    if (ok) App.state.photoCount = (App.state.photoCount || 0) + ok;
    // 保证该日记录存在（照片挂在日期上）
    var d = getDay(target.date, true);
    persist(target.date, { keep: true });
    if (ok) U.toast('已添加 ' + ok + ' 张' + (fail ? '，' + fail + ' 张失败' : ''));
    else U.toast('图片添加失败' + (DB.mode === 'ls' ? '（本地存储空间不足）' : ''));
    return ok;
  }

  async function removePhoto(id, date) {
    await DB.deletePhoto(id);
    var arr = App.state.photoCache[date] || [];
    App.state.photoCache[date] = arr.filter(function (p) { return p.id !== id; });
    if (App.state.photoCount > 0) App.state.photoCount--;
    await refreshPhotoCount();
    persist(date);
  }

  async function refreshPhotoCount() {
    try { App.state.photoCount = await DB.countPhotos(); } catch (e) { /* 忽略 */ }
  }

  async function ensurePhotos(date) {
    if (App.state.photoCache[date]) return App.state.photoCache[date];
    var arr = await DB.photosOf(date);
    arr.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    App.state.photoCache[date] = arr;
    return arr;
  }

  function photosOf(date) { return App.state.photoCache[date] || []; }

  /* ---------------- 事件总线（同一动作只触发一次渲染） ---------------- */
  var _renderQueued = false;
  App.on = function (name, fn) { (App._h = App._h || {})[name] = (App._h[name] || []).concat(fn); };
  App.emit = function (name, data) {
    (App._h && App._h[name] || []).forEach(function (f) { try { f(data); } catch (e) { console.error(e); } });
  };
  App.requestRender = function () {
    if (_renderQueued) return;
    _renderQueued = true;
    requestAnimationFrame(function () { _renderQueued = false; App.render(); });
  };

  /* ---------------- 路由 ---------------- */
  var TABS = ['today', 'history', 'trend', 'me'];
  function hashOf(tab, date) {
    if (tab === 'today') return '#/today/' + (date || U.today());
    return '#/' + tab;
  }
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/');
    var tab = TABS.indexOf(p[0]) >= 0 ? p[0] : 'today';
    var date = U.isKey(p[1]) ? p[1] : U.today();
    return { tab: tab, date: date };
  }
  App.go = function (tab, date) {
    var next = hashOf(tab, date || App.state.date);
    if (location.hash === next) { App.applyRoute(); return; }
    location.hash = next;
  };
  App.applyRoute = function () {
    var r = parseHash();
    App.state.tab = r.tab;
    if (r.tab === 'today') App.state.date = r.date;
    U.qsa('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === r.tab); });
    App.ensureDatePhotos().then(function () { App.render(); });
  };

  App.ensureDatePhotos = async function () {
    if (App.state.tab === 'today') await ensurePhotos(App.state.date);
    else if (App.state.tab === 'history') {
      var m = App.state.calY + '-' + U.pad(App.state.calM + 1);
      var ds = sortedDates().filter(function (k) { return k.slice(0, 7) === m; });
      if (ds.indexOf(App.state.date) < 0) ds.push(App.state.date);
      for (var i = 0; i < ds.length; i++) await ensurePhotos(ds[i]);
    }
  };

  /* ---------------- 渲染调度 ---------------- */
  App.render = function () {
    var view = document.getElementById('view');
    if (!view || !w.Views) return;
    var tab = App.state.tab;
    var html = '';
    try {
      if (tab === 'today') html = Views.today();
      else if (tab === 'history') html = Views.history();
      else if (tab === 'trend') html = Views.trend();
      else html = Views.me();
    } catch (e) {
      console.error(e);
      html = '<div class="empty"><p>页面渲染出错：' + U.esc(e.message) + '</p></div>';
    }
    view.innerHTML = html;
    Views.topbar();
    App.emit('post-render', { tab: tab });
  };

  App.scrollTop = function () { window.scrollTo({ top: 0, behavior: 'auto' }); };

  /* ---------------- 启动 ---------------- */
  App.boot = async function () {

    // 幂等：重复调用会让事件委托注册两遍，一次点击被处理两次（开关类操作会自我抵消）
    if (App._booted) return;
    App._booted = true;
    var mode = await DB.init();
    App.state.days = await DB.allDays();
    Object.keys(App.state.days).forEach(function (k) { App.state.days[k] = normalize(App.state.days[k]); });
    App.state.settings = (await DB.getMeta('settings', {})) || {};
    App.state.photoCount = await DB.countPhotos();
    if (!App.state.settings.exerciseTypes) {
      App.state.settings.exerciseTypes = ['快走', '跑步', '骑行', '游泳', '跳绳', '力量训练', '瑜伽', '球类', '爬楼', '家务'];
    }
    App.state.tab = parseHash().tab;
    App.state.date = parseHash().date;
    var d = U.fromKey(App.state.date);
    App.state.calY = d.getFullYear();
    App.state.calM = d.getMonth();

    window.addEventListener('hashchange', function () { App.applyRoute(); App.scrollTop(); });
    bindTopbar();
    bindDelegates();
    App.applyRoute();
    document.getElementById('boot').hidden = true;
    if (mode === 'ls') {
      setTimeout(function () {
        U.toast('本机数据库不可用，已临时退到简易存储（容量小、可能被系统清空）。请点「我的」页底部查看原因并先导出一份备份', 5200);
      }, 700);
    } else if (w.DB && w.DB.persistence !== 'granted') {
      // 持久存储申请最好带用户手势，成功率高得多：首次点击时再补一次
      var once = function () {
        document.removeEventListener('click', once, true);
        if (!w.DB.requestPersist) return;
        w.DB.requestPersist().then(function (r) {
          if (r === 'granted') {
            if (w.DB.readQuota) { w.DB.readQuota().then(function () { App.requestRender(); }, function () { App.requestRender(); }); }
            else App.requestRender();
          }
        });
      };
      document.addEventListener('click', once, true);
    }

    /* 云服务（可选层）：不 await，绝不阻塞应用启动。
       授权回调必须在任何路由守卫之前处理，所以在这里就发起。 */
    if (w.Cloud) {
      w.Cloud.onAuthChange(function () { App.requestRender(); });
      w.Cloud.init().then(function () {
        if (App.state.tab === 'me') App.requestRender();
      });
    }
  };

  /* ---------------- 顶栏滚动阴影 ---------------- */
  function bindTopbar() {
    var tb = document.querySelector('.topbar');
    var onScroll = function () { tb.classList.toggle('is-stuck', window.scrollY > 4); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    document.getElementById('tbRight').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'prev-day') App.go('today', U.addDays(App.state.date, -1));
      if (act === 'next-day') App.go('today', U.addDays(App.state.date, 1));
      if (act === 'pick-day') App.openCalendar(App.state.date);
      if (act === 'today-jump') App.go('today', U.today());
    });
  }

  /* ---------------- 弹层 ---------------- */
  App.sheet = function (html) {
    var s = document.getElementById('sheet');
    document.getElementById('sheetBody').innerHTML = html;
    s.hidden = false;
  };
  App.closeSheet = function () {
    document.getElementById('sheet').hidden = true;
    document.getElementById('sheetBody').innerHTML = '';
  };

  App.openCalendar = function (date) {
    var d = U.fromKey(date);
    App.state.calY = d.getFullYear();
    App.state.calM = d.getMonth();
    App.sheet(Views.calendarSheet(date));
  };

  App.viewer = function (src) {
    var v = document.createElement('div');
    v.className = 'viewer';
    v.innerHTML = '<button class="v-x" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button><img alt="">';
    v.querySelector('img').src = src;
    v.addEventListener('click', function () { v.remove(); });
    document.body.appendChild(v);
  };

  /* ---------------- 全局事件委托 ---------------- */
  function bindDelegates() {
    /* 底部 tab */
    document.getElementById('tabbar').addEventListener('click', function (e) {
      var b = e.target.closest('.tab');
      if (!b) return;
      App.go(b.getAttribute('data-tab'));
    });

    /* 输入：立即写入内存，落盘由聚合定时器统一处理 */
    function fieldValue(el) {
      if (el.getAttribute('data-type') === 'num') {
        if (el.value === '') return null;
        var n = U.num(el.value, null);
        return n === null ? undefined : n;   // undefined = 当前输入非法（如只打了减号），先忽略
      }
      return el.value;
    }

    function handleField(el) {
      var path = el.getAttribute('data-f');
      var date = el.getAttribute('data-date') || App.state.date;
      var v = fieldValue(el);
      if (v === undefined) return;
      saveField(date, path, v);
      if (path === 'sleepStart' || path === 'sleepEnd') syncSleepField(date);
      refreshCardSummary(el, date);
    }

    /** 输入时同步刷新所属折叠卡的摘要，避免头部一直停在旧值 */
    function refreshCardSummary(el, date) {
      var card = el.closest && el.closest('.card.fold');
      if (!card || !w.Views || !w.Views.cardSummary) return;
      var hd = card.querySelector('.fold-hd');
      var note = hd && hd.querySelector('.hd-note');
      if (!note) return;
      note.textContent = w.Views.cardSummary(hd.getAttribute('data-sec'), date) || '未记录';
    }

    /** 起止时间变化后，把算出来的时长同步回输入框（不重绘，避免丢焦点） */
    function syncSleepField(date) {
      var el = document.querySelector('[data-f="sleepHours"][data-date="' + date + '"]');
      if (!el || el === document.activeElement) return;
      var d = App.state.days[date];
      el.value = (d && U.isNum(d.sleepHours)) ? U.nice(d.sleepHours, 2) : '';
    }

    document.addEventListener('input', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute || !el.hasAttribute('data-f')) return;
      handleField(el);
    });
    /* 手机号一改就清掉上一次的格式错误提示 */
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'cl-phone') setPhoneErr('');
    });
    document.addEventListener('change', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute || !el.hasAttribute('data-f')) return;
      handleField(el);
    });

    /* 失焦时立刻落盘 */
    document.addEventListener('blur', function (e) {
      var el = e.target;
      if (el && el.getAttribute && el.hasAttribute('data-f')) flushNow();
    }, true);

    /* 点击动作 */
    document.addEventListener('click', function (e) {
      var tg = e.target;
      if (!tg || !tg.closest) return;
      var el = tg.closest('[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      var date = el.getAttribute('data-date') || App.state.date;

      switch (act) {
        case 'sheet-close': App.closeSheet(); break;

        case 'goto-day': App.go('today', date); App.scrollTop(); break;
        case 'goto-me': App.go('me'); App.scrollTop(); break;

        /* 卡片折叠：只切 class 不重绘，避免打断正在输入的内容与滚动位置 */
        case 'fold': {
          var sec = el.getAttribute('data-sec');
          var nowOpen = !App.state.open[sec];
          App.state.open[sec] = nowOpen;
          var fc = el.closest('.card');
          if (fc) fc.classList.toggle('fold-open', nowOpen);
          el.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
          /* 收起时刷新摘要——否则刚填完就收起，摘要还停在「未记录」，看着像没记上 */
          if (!nowOpen && w.Views && w.Views.cardSummary) {
            var noteEl = el.querySelector('.hd-note');
            if (noteEl) noteEl.textContent = w.Views.cardSummary(sec, date) || '未记录';
          }
          break;
        }
        case 'fold-photos': {
          var fk = el.getAttribute('data-key');
          var pOpen = !App.state.open['ph:' + fk];
          App.state.open['ph:' + fk] = pOpen;
          var fblk = el.closest('.meal-block');
          if (fblk) fblk.classList.toggle('ph-open', pOpen);
          el.setAttribute('aria-expanded', pOpen ? 'true' : 'false');
          break;
        }

        case 'mood':
          saveField(date, 'feeling.mood', Number(el.getAttribute('data-v')) === getDay(date).feeling.mood ? null : Number(el.getAttribute('data-v')));
          App.render();
          break;

        case 'star':
          saveField(date, 'sleepQuality', Number(el.getAttribute('data-v')) === getDay(date).sleepQuality ? null : Number(el.getAttribute('data-v')));
          App.render();
          break;

        case 'add-ex': App.openExerciseSheet(date); break;
        case 'del-ex': {
          var id = el.getAttribute('data-id');
          var d = getDay(date, true);
          d.exercises = d.exercises.filter(function (x) { return x.id !== id; });
          persist(date);
          App.render();
          break;
        }

        case 'add-photo':
          App.photoTarget = { date: date, meal: el.getAttribute('data-meal') };
          document.getElementById('photoPicker').click();
          break;
        case 'del-photo':
          removePhoto(el.getAttribute('data-id'), date).then(function () { App.render(); });
          break;
        case 'view-photo':
          App.viewer(el.getAttribute('data-src'));
          break;

        case 'cal-prev': case 'cal-next': {
          var step = act === 'cal-prev' ? -1 : 1;
          var m = App.state.calM + step, y = App.state.calY;
          if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
          App.state.calM = m; App.state.calY = y;
          var inSheet = el.closest('.sheet');
          if (inSheet) { App.ensureDatePhotos().then(function () { App.sheet(Views.calendarSheet(null)); }); }
          else { App.ensureDatePhotos().then(function () { App.render(); }); }
          break;
        }
        case 'cal-today':
          App.closeSheet();
          App.go('today', U.today());
          break;
        case 'pick-cal-day': {
          var pk = el.getAttribute('data-key');
          App.closeSheet();
          App.go('today', pk);
          break;
        }
        case 'cal-open': App.openCalendar(date); break;

        case 'range':
          App.state.trendDays = Number(el.getAttribute('data-v'));
          App.render();
          break;

        case 'save-goal': {
          var g = readGoalForm();
          App.state.settings = Object.assign({}, App.state.settings, g);
          DB.setMeta('settings', App.state.settings).then(function () {
            U.toast('目标已保存');
            App.go('me');
            App.render();
          });
          break;
        }
        case 'quick-goal-from-current': {
          var input = document.getElementById('g-start');
          if (input) {
            var lw = lastWeight();
            input.value = lw === null ? '' : lw;
          }
          break;
        }

        case 'ex-type': {
          var t = el.getAttribute('data-v');
          var ti = document.getElementById('ex-type');
          if (ti) ti.value = t;
          U.qsa('#ex-type-chips .chip').forEach(function (c) { c.classList.toggle('on', c === el); });
          break;
        }
        case 'save-ex': {
          var dd = App.state.days[date] || getDay(date, true);
          var type = (document.getElementById('ex-type') || {}).value || '';
          var dur = document.getElementById('ex-dur').value;
          var kcal = document.getElementById('ex-kcal').value;
          var note = document.getElementById('ex-note').value;
          if (!type.trim() && !dur && !kcal) { U.toast('请至少填运动名称或时长'); break; }
          dd.exercises.push({
            id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
            type: type.trim() || '运动',
            dur: dur === '' ? null : U.num(dur, null),
            kcal: kcal === '' ? null : U.num(kcal, null),
            note: (note || '').trim()
          });
          persist(date);
          App.closeSheet();
          App.render();
          U.toast('已记录运动');
          break;
        }

        case 'export-xlsx': doExport('xlsx'); break;
        case 'export-json': doExport('json'); break;
        case 'import-json': document.getElementById('jsonPicker').click(); break;
        case 'ask-persist': {
          // 用户手动点「申请保护」：这是有用户手势的调用，浏览器更容易批准
          if (!w.DB || !w.DB.requestPersist) { U.toast('当前环境不支持申请持久存储'); break; }
          w.DB.requestPersist().then(function (r) {
            if (w.DB.readQuota) w.DB.readQuota().then(function () { App.render(); }, function () { App.render(); });
            else App.render();
            if (r === 'granted') U.toast('已获得持久存储授权，系统不会再自动清理本应用数据', 3000);
            else if (r === 'denied') U.toast('浏览器暂未批准。建议把页面「添加到主屏幕」后再使用，并定期云端备份', 4200);
            else U.toast('此浏览器不支持持久存储授权，建议添加到主屏幕 + 定期云端备份', 4200);
          });
          break;
        }

        /* ---------------- 云端备份（可选层） ---------------- */
        case 'cloud-retry':
          if (w.Cloud) { w.Cloud.retry().then(function () { App.render(); }); }
          break;

        case 'cloud-send': {
          var pEl = document.getElementById('cl-phone');
          var phone = pEl ? pEl.value.replace(/\D/g, '') : '';
          setPhoneErr('');
          if (!w.Cloud) break;
          if (!/^1\d{10}$/.test(phone)) { setPhoneErr('请输入正确的 11 位手机号'); break; }
          var sendBtn = el;
          sendBtn.disabled = true;
          var oldTxt = sendBtn.textContent;
          sendBtn.textContent = '发送中…';
          w.Cloud.sendCode(phone).then(function (r) {
            if (r && r.error) {
              sendBtn.disabled = false;
              sendBtn.textContent = oldTxt;
              setPhoneErr(r.error.message || '验证码发送失败');
              return;
            }
            startSendCountdown(sendBtn, oldTxt);
            U.toast('验证码已发送，请注意查收');
          });
          break;
        }

        case 'cloud-login': {
          if (!w.Cloud) break;
          var p2 = document.getElementById('cl-phone');
          var c2 = document.getElementById('cl-code');
          var phone2 = p2 ? p2.value.replace(/\D/g, '') : '';
          var code2 = c2 ? c2.value.replace(/\D/g, '') : '';
          if (!/^1\d{10}$/.test(phone2)) { setPhoneErr('请输入正确的 11 位手机号'); break; }
          if (!code2) { U.toast('请先填写短信验证码'); break; }
          el.disabled = true;
          el.textContent = '登录中…';
          w.Cloud.verifyCode(phone2, code2).then(function (r) {
            if (r && r.error) {
              el.disabled = false;
              el.textContent = '登录 / 注册';
              U.toast(r.error.message || '登录失败，请重试', 3200);
              return;
            }
            App.render();
            U.toast('已登录，可以备份到云端了');
          });
          break;
        }

        case 'cloud-wechat':
          if (!w.Cloud) break;
          w.Cloud.signInWechat().then(function (r) {
            if (r && r.error) U.toast(r.error.message || '微信登录失败', 3200);
          });
          break;

        case 'cloud-logout':
          if (!w.Cloud) break;
          w.Cloud.signOut().then(function () { App.render(); U.toast('已退出登录'); });
          break;

        case 'cloud-backup': {
          if (!w.Cloud) break;
          App.sheet('<div class="sheet-grip"></div><div class="sheet-hd"><h3>备份到云端</h3>' +
            '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
            '<p class="hint" id="cl-prog">准备中…</p></div>');
          w.Cloud.backup(setProg).then(function (r) {
            App.closeSheet();
            App.render();
            var bad = (r.failDays || 0) + (r.failPhotos || 0);
            U.toast('已备份 ' + r.days + ' 天 · ' + r.photos + ' 张照片' + (bad ? '（' + bad + ' 项失败）' : ''), 3200);
          }).catch(function (e) {
            App.closeSheet();
            U.toast((e && e.message) || '备份失败，请稍后重试', 3600);
          });
          break;
        }

        case 'cloud-restore': {
          if (!w.Cloud) break;
          App.sheet('<div class="sheet-grip"></div><div class="sheet-hd"><h3>从云端恢复到本机</h3>' +
            '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
            '<p class="hint" style="margin-top:0">默认<b>只补本机没有的、或比本机更新的</b>记录，手机上较新的内容不会被旧备份覆盖。</p>' +
            '<div class="btn-row mt16"><button class="btn btn-outline" data-act="cloud-restore-run" data-mode="merge" type="button">智能合并</button>' +
            '<button class="btn btn-danger" data-act="cloud-restore-run" data-mode="replace" type="button">全部以云端为准</button></div>');
          break;
        }

        case 'cloud-restore-run': {
          if (!w.Cloud) break;
          var rmode = el.getAttribute('data-mode') || 'merge';
          if (rmode === 'replace') {
            App.sheet('<div class="sheet-grip"></div><div class="sheet-hd"><h3>确认覆盖本机？</h3>' +
              '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
              '<p class="hint" style="margin-top:0;color:var(--bad);font-weight:600">本机比云端新的记录也会被云端版本替换，且不可撤销。</p>' +
              '<div class="btn-row mt16"><button class="btn btn-outline" data-act="sheet-close" type="button">取消</button>' +
              '<button class="btn btn-danger" data-act="cloud-restore-go" data-mode="replace" type="button">确认覆盖</button></div>');
            break;
          }
          doRestore('merge');
          break;
        }
        case 'cloud-restore-go': doRestore('replace'); break;

        case 'clear-all': {
          App.sheet(
            '<div class="sheet-grip"></div><div class="sheet-hd"><h3>清除全部数据</h3>' +
            '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
            '<p class="hint" style="color:var(--bad);font-weight:600">此操作会删除所有记录与照片，且不可撤销。建议先导出备份。</p>' +
            '<div class="btn-row mt16"><button class="btn btn-outline" data-act="sheet-close" type="button">取消</button>' +
            '<button class="btn btn-danger" data-act="clear-confirm" type="button">确认清除</button></div>'
          );
          break;
        }
        case 'clear-confirm': {
          DB.clearAll().then(function () {
            App.state.days = {};
            App.state.photoCache = {};
            App.state.photoCount = 0;
            App.state.settings = { exerciseTypes: App.state.settings.exerciseTypes };
            DB.setMeta('settings', App.state.settings);
            App.closeSheet();
            App.render();
            U.toast('数据已清除');
          });
          break;
        }
      }
    });

    /* 文件选择
       注意：先把 FileList 复制成数组再清空 input.value —— 
       直接清空会让活引用 FileList 变空，真机与无头浏览器都踩过。 */
    var picker = document.getElementById('photoPicker');
    picker.addEventListener('change', function () {
      var files = Array.prototype.slice.call(picker.files || []);
      var target = App.photoTarget || { date: App.state.date, meal: 'other' };
      App.photoTarget = null;
      picker.value = '';
      if (!files.length) return;
      addPhotos(files, target).then(function () { App.render(); });
    });

    var jpicker = document.getElementById('jsonPicker');
    jpicker.addEventListener('change', function () {
      var f = (jpicker.files || [])[0];
      jpicker.value = '';
      if (!f) return;
      handleImport(f);
    });

    /* 弹层遮罩关闭 */
    document.getElementById('sheet').addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-sheet-close') || e.target.closest('[data-sheet-close]')) App.closeSheet();
    });

    /* 防止 iOS 双击缩放 */
    var lastTouch = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouch <= 300) e.preventDefault();
      lastTouch = now;
    }, false);
  }

  function readGoalForm() {
    function v(id) { var el = document.getElementById(id); return el ? el.value : ''; }
    var g = {
      height: U.num(v('g-height'), null),
      startWeight: U.num(v('g-start'), null),
      startDate: v('g-startdate') || null,
      targetWeight: U.num(v('g-target'), null),
      targetDate: v('g-targetdate') || null,
      weeklyRate: U.num(v('g-rate'), null)
    };
    return g;
  }

  /* ---------------- 云端备份相关小工具 ---------------- */
  function setPhoneErr(t) {
    var e = document.getElementById('cl-phone-err');
    if (e) e.textContent = t || '';
  }

  /** 验证码重发倒计时；按钮被重绘后自动停表，不会误改别的元素 */
  function startSendCountdown(btn, restoreText) {
    var left = 60;
    btn.disabled = true;
    btn.textContent = left + 's 后重发';
    var t = setInterval(function () {
      if (!document.body.contains(btn)) { clearInterval(t); return; }
      left--;
      if (left <= 0) {
        clearInterval(t);
        btn.disabled = false;
        btn.textContent = restoreText || '获取验证码';
        return;
      }
      btn.textContent = left + 's 后重发';
    }, 1000);
  }

  /** 进度文案；弹层被关掉后静默忽略 */
  function setProg(text) {
    var e = document.getElementById('cl-prog');
    if (e) e.textContent = text;
  }

  function doRestore(mode) {
    App.sheet('<div class="sheet-grip"></div><div class="sheet-hd"><h3>从云端恢复</h3>' +
      '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
      '<p class="hint" id="cl-prog">准备中…</p></div>');
    w.Cloud.restore(mode, setProg).then(function (r) {
      return DB.allDays().then(function (days) {
        Object.keys(days).forEach(function (k) { days[k] = normalize(days[k]); });
        App.state.days = days;
        return DB.countPhotos();
      }).then(function (n) {
        App.state.photoCount = n;
        return DB.getMeta('settings', App.state.settings);
      }).then(function (s) {
        App.state.settings = s || App.state.settings;
        App.closeSheet();
        App.render();
        if (r.empty) U.toast('云端还没有备份记录', 3000);
        else U.toast('已恢复 ' + r.days + ' 天记录 · ' + r.photos + ' 张照片', 3200);
      });
    }).catch(function (e) {
      App.closeSheet();
      U.toast((e && e.message) || '恢复失败，请稍后重试', 3600);
    });
  }

  async function doExport(kind) {
    var payload = { settings: App.state.settings, days: App.state.days, photos: [] };
    try {
      if (kind === 'xlsx') {
        var r = Export.exportXLSX(payload);
        U.toast('已导出 Excel（' + r.days + ' 天记录）', 2600);
      } else {
        payload.photos = await DB.allPhotos();
        var r2 = await Export.exportJSON(payload);
        U.toast('已导出完整备份：' + r2.days + ' 天 / ' + r2.photos + ' 张图', 2600);
      }
    } catch (e) {
      U.toast('导出失败：' + (e && e.message ? e.message : '未知错误'));
    }
  }

  async function handleImport(file) {
    try {
      var obj = await Export.readJSONFile(file);
      App.sheet(
        '<div class="sheet-grip"></div><div class="sheet-hd"><h3>导入备份</h3>' +
        '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
        '<p class="hint">文件包含 <b>' + Object.keys(obj.days || {}).length + '</b> 天记录、<b>' + (obj.photos || []).length + '</b> 张图片。</p>' +
        '<div class="field mt12"><label>导入方式</label><div class="seg" id="imp-mode">' +
        '<button class="on" data-act="imp-mode" data-v="merge" type="button">合并（保留现有）</button>' +
        '<button data-act="imp-mode" data-v="replace" type="button">覆盖（清空后导入）</button></div></div>' +
        '<div class="btn-row mt16"><button class="btn btn-outline" data-act="sheet-close" type="button">取消</button>' +
        '<button class="btn btn-primary" data-act="imp-confirm" type="button">开始导入</button></div>'
      );
      App._pendingImport = obj;
    } catch (e) {
      U.toast('文件无法识别：' + (e && e.message ? e.message : '格式错误'), 3000);
    }
  }

  /* 导入相关动作单独委托 */
  document.addEventListener('click', function (e) {
    var tg = e.target;
    if (!tg || !tg.closest) return;
    var el = tg.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'imp-mode') {
      U.qsa('#imp-mode button').forEach(function (b) { b.classList.toggle('on', b === el); });
    }
    if (act === 'imp-confirm') {
      var obj = App._pendingImport;
      if (!obj) return;
      var modeEl = document.querySelector('#imp-mode button.on');
      var mode = modeEl ? modeEl.getAttribute('data-v') : 'merge';
      DB.importAll(obj, mode).then(async function (r) {
        App.state.days = await DB.allDays();
        Object.keys(App.state.days).forEach(function (k) { App.state.days[k] = normalize(App.state.days[k]); });
        App.state.settings = (await DB.getMeta('settings', {})) || App.state.settings;
        App.state.photoCache = {};
        await refreshPhotoCount();
        App._pendingImport = null;
        App.closeSheet();
        App.render();
        U.toast('导入完成：' + r.days + ' 天 / ' + r.photos + ' 张图' + (r.failPhotos ? '（' + r.failPhotos + ' 张失败）' : ''), 2800);
      }).catch(function (err) {
        U.toast('导入失败：' + (err && err.message ? err.message : '未知错误'));
      });
    }
  });

  App.openExerciseSheet = function (date) {
    var types = (App.state.settings.exerciseTypes || []).slice(0, 10);
    App.sheet(
      '<div class="sheet-grip"></div><div class="sheet-hd"><h3>添加运动</h3>' +
      '<button class="sb-x" data-act="sheet-close" type="button"><svg class="ic"><use href="#ic-close"></use></svg></button></div>' +
      '<div class="chips" id="ex-type-chips">' + types.map(function (t) {
        return '<button class="chip" data-act="ex-type" data-v="' + U.attr(t) + '" type="button">' + U.esc(t) + '</button>';
      }).join('') + '</div>' +
      '<div class="field mt12"><label>运动名称</label><input class="inp" id="ex-type" placeholder="如：慢跑 5 公里"></div>' +
      '<div class="grid2"><div class="field"><label>时长（分钟）</label><input class="inp" id="ex-dur" inputmode="decimal" placeholder="30"></div>' +
      '<div class="field"><label>消耗（kcal，可选）</label><input class="inp" id="ex-kcal" inputmode="decimal" placeholder="250"></div></div>' +
      '<div class="field"><label>备注（可选）</label><input class="inp" id="ex-note" placeholder="强度、感受…"></div>' +
      '<div class="btn-row mt16"><button class="btn btn-outline" data-act="sheet-close" type="button">取消</button>' +
      '<button class="btn btn-primary" data-act="save-ex" data-date="' + U.attr(date) + '" type="button">保存</button></div>'
    );
  };

  /* 分享相关功能已移除（「我的」页只保留目标 / 数据导出 / 清除数据）。 */
  /* ---------------- 对外暴露给视图层 ---------------- */
  App.getDay = getDay;
  App.goalInfo = goalInfo;
  App.photosOf = photosOf;
  App.ensurePhotos = ensurePhotos;
  App.lastWeightBefore = lastWeightBefore;
  App.firstWeight = firstWeight;
  App.lastWeight = lastWeight;
  App.sortedDates = sortedDates;
  App.saveField = saveField;
  App.isEmptyDay = isEmptyDay;

  w.App = App;
  w.addEventListener('load', function () { App.boot(); });
})(window);

</script>
<script>
/* ===========================================================
   views.js —— 各页面 HTML 生成
   全部为纯字符串函数，无副作用（除 topbar 直接改 DOM）
   =========================================================== */
(function (w) {
  'use strict';

  var S = function () { return App.state; };
  function ic(id, cls) { return '<svg class="ic ' + (cls || '') + '"><use href="#' + id + '"></use></svg>'; }
  function val(v) { return U.isNum(v) ? U.esc(U.nice(v, 2)) : ''; }
  function numInput(path, date, v, ph, cls, extra) {
    return '<input class="inp ' + (cls || '') + '" type="text" inputmode="decimal" data-type="num" data-f="' + path +
      '" data-date="' + date + '" value="' + (U.isNum(v) ? U.esc(String(v)) : '') + '" placeholder="' + U.attr(ph || '') + '"' +
      (extra || '') + ' autocomplete="off">';
  }
  function txtInput(path, date, v, ph, extra) {
    return '<input class="inp" type="text" data-f="' + path + '" data-date="' + date + '" value="' + U.esc(v || '') +
      '" placeholder="' + U.attr(ph || '') + '"' + (extra || '') + ' autocomplete="off">';
  }
  function ta(path, date, v, ph, rows) {
    return '<textarea class="inp" rows="' + (rows || 2) + '" data-f="' + path + '" data-date="' + date +
      '" placeholder="' + U.attr(ph || '') + '">' + U.esc(v || '') + '</textarea>';
  }
  function cardHead(icon, title, note, tone) {
    return '<div class="card-hd"><span class="ic-badge"' + (tone ? ' style="background:' + tone.bg + ';color:' + tone.fg + '"' : '') +
      '>' + ic(icon) + '</span><h3>' + title + '</h3>' + (note ? '<span class="hd-note">' + note + '</span>' : '') + '</div>';
  }

  /** 星星串（不用 repeat，兼容老引擎） */
  function stars(n) {
    var s = '';
    for (var i = 0; i < n; i++) s += '★';
    return s;
  }

  /** 摘要用：把长文本裁到 n 个字 */
  function brief(s, n) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  /**
   * 可折叠卡片：默认收起，点标题栏展开后才写入 / 编辑 / 删除。
   * sec  —— 展开状态键；展开状态记在 App.state.open 里，切换页签后仍保持
   * sum  —— 收起时右侧显示的一行摘要，叫人一眼知道记没记、记了什么
   */
  function foldCard(icon, title, sum, sec, body) {
    var open = !!(S().open || {})[sec];
    return '<section class="card fold' + (open ? ' fold-open' : '') + '">' +
      '<button class="card-hd fold-hd" data-act="fold" data-sec="' + sec + '" type="button" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="ic-badge">' + ic(icon) + '</span>' +
      '<h3>' + title + '</h3>' +
      '<span class="hd-note">' + U.esc(sum || '未记录') + '</span>' +
      '<span class="chev">' + ic('ic-down') + '</span>' +
      '</button>' +
      '<div class="card-bd">' + body + '</div>' +
      '</section>';
  }

  /* ---- 各折叠卡的摘要（纯文本；收起时显示在标题右侧） ---- */
  function sumBody(d) {
    var a = [];
    if (U.isNum(d.weight)) a.push(U.nice(d.weight, 1) + ' kg');
    if (U.isNum(d.bodyFat)) a.push('体脂 ' + U.nice(d.bodyFat, 1) + '%');
    return a.join(' · ');
  }
  function sumSleep(d) {
    var a = [];
    if (d.sleepStart || d.sleepEnd) a.push((d.sleepStart || '—') + ' → ' + (d.sleepEnd || '—'));
    if (U.isNum(d.sleepHours)) a.push(U.nice(d.sleepHours, 2) + ' 小时');
    if (U.isNum(d.sleepQuality)) a.push(stars(d.sleepQuality));
    return a.join(' · ');
  }
  function sumEx(d) {
    var ex = d.exercises || [];
    var dur = ex.reduce(function (a, e) { return a + (U.num(e.dur, 0) || 0); }, 0);
    var a = [];
    if (U.isNum(d.steps)) a.push(U.nice(d.steps, 0) + ' 步');
    if (ex.length) a.push(ex.length + ' 项运动');
    if (dur) a.push(U.nice(dur, 0) + ' 分钟');
    return a.join(' · ');
  }
  function sumMeals(d, photos) {
    var n = 0;
    Export.MEALS.forEach(function (m) {
      var mm = d.meals[m[0]] || {};
      if ((mm.text || '').trim() || mm.time) n++;
    });
    var a = [];
    if (n) a.push('已记 ' + n + ' 餐');
    if (photos && photos.length) a.push(photos.length + ' 张照片');
    return a.join(' · ');
  }
  function sumFeeling(d) {
    var a = [];
    if (U.isNum(d.feeling.mood)) a.push('心情 ' + (Export.MOOD[d.feeling.mood] || ''));
    if ((d.feeling.text || '').trim()) a.push(brief(d.feeling.text, 14));
    return a.join(' · ');
  }

  /** 供收起卡片时刷新摘要用（用户刚填完就收起，摘要必须跟着变） */
  function cardSummary(sec, date) {
    var d = App.getDay(date, false);
    if (sec === 'body') return sumBody(d);
    if (sec === 'sleep') return sumSleep(d);
    if (sec === 'ex') return sumEx(d);
    if (sec === 'meals') return sumMeals(d, App.photosOf(date));
    if (sec === 'feeling') return sumFeeling(d);
    return '';
  }
  function ring(pct, label, sub, color) {
    var r = 42, C = 2 * Math.PI * r;
    var p = pct === null || pct === undefined ? 0 : U.clamp(pct, 0, 1);
    return '<div class="ring"><svg viewBox="0 0 96 96">' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="#EDE8E0" stroke-width="9"/>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="' + (color || '#1F5F4B') + '" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - p)).toFixed(1) + '"/>' +
      '</svg><div class="ring-txt"><span class="rt-num">' + label + '</span><span class="rt-lb">' + sub + '</span></div></div>';
  }
  function deltaHTML(cur, prev, lowerIsBetter, unit) {
    if (!U.isNum(cur) || !U.isNum(prev)) return '';
    var d = Math.round((cur - prev) * 100) / 100;
    if (Math.abs(d) < 0.005) return '<span class="delta flat">持平</span>';
    var cls = 'flat';
    if (lowerIsBetter) cls = d < 0 ? 'down' : 'up';
    else cls = d > 0 ? 'down' : 'up';
    return '<span class="delta ' + cls + '">' + (d > 0 ? '+' : '') + U.nice(d, 2) + (unit || '') + '</span>';
  }

  /* ================= 顶栏 ================= */
  var TITLES = { today: '今日', history: '记录', trend: '趋势', me: '我的' };

  function topbar() {
    var st = S();
    var sub = document.getElementById('tbSub');
    var right = document.getElementById('tbRight');
    if (!sub || !right) return;
    sub.textContent = TITLES[st.tab] || '';

    if (st.tab === 'today') {
      right.innerHTML =
        '<button class="tb-btn" data-act="prev-day" type="button" aria-label="前一天">' + ic('ic-back') + '</button>' +
        '<button class="tb-btn is-primary" data-act="pick-day" type="button">' +
        U.esc(U.fromKey(st.date).getMonth() + 1) + '月' + U.esc(U.fromKey(st.date).getDate()) + '日 · ' + U.relDay(st.date) + '</button>' +
        '<button class="tb-btn" data-act="next-day" type="button" aria-label="后一天" style="transform:rotate(180deg)">' + ic('ic-back') + '</button>';
    } else if (st.tab === 'history') {
      right.innerHTML = '<button class="tb-btn" data-act="today-jump" type="button">回到今天</button>';
    } else {
      right.innerHTML = '';
    }
  }

  /* ================= 日历 ================= */
  function calendarHTML(y, m, sel, opts) {
    opts = opts || {};
    var first = new Date(y, m, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = U.today();
    var hasSet = {};
    Object.keys(S().days).forEach(function (k) {
      if (!isEmpty2(S().days[k])) hasSet[k] = 1;
    });

    var out = '<div class="cal-hd"><div class="ch-m">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
      '<div class="cal-nav">' +
      (opts.withToday ? '<button data-act="cal-today" type="button" style="width:auto;padding:0 12px;font-size:13px;font-weight:600">今天</button>' : '') +
      '<button data-act="cal-prev" type="button" aria-label="上个月">' + ic('ic-back') + '</button>' +
      '<button data-act="cal-next" type="button" aria-label="下个月" style="transform:rotate(180deg)">' + ic('ic-back') + '</button>' +
      '</div></div>';

    out += '<div class="cal-grid">';
    U.WEEK_CN.forEach(function (d) { out += '<div class="cal-dow">' + d + '</div>'; });
    for (var i = 0; i < startDow; i++) out += '<div class="cal-d blank">·</div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var key = y + '-' + U.pad(m + 1) + '-' + U.pad(d);
      var cls = 'cal-d';
      if (hasSet[key]) cls += ' has';
      if (key === today) cls += ' today';
      if (sel && key === sel) cls += ' sel';
      out += '<button class="' + cls + '" data-act="pick-cal-day" data-key="' + key + '" type="button">' + d +
        (hasSet[key] ? '<i class="mark"></i>' : '') + '</button>';
    }
    out += '</div>';
    out += '<div class="hint" style="display:flex;gap:14px;flex-wrap:wrap">' +
      '<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E7F1EC;box-shadow:inset 0 0 0 1px #C6DFD4;margin-right:5px"></i>有记录</span>' +
      '<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1F5F4B;margin-right:5px"></i>当前选中</span>' +
      '</div>';
    return out;
  }

  function calendarSheet() {
    var st = S();
    return '<div class="sheet-grip"></div>' +
      '<div class="sheet-hd"><h3>选择日期</h3>' +
      '<button class="sb-x" data-act="sheet-close" type="button">' + ic('ic-close') + '</button></div>' +
      calendarHTML(st.calY, st.calM, st.date, { withToday: true });
  }

  /* ================= 今日 ================= */
  function today() {
    var st = S();
    var date = st.date;
    var d = App.getDay(date, false);
    var photos = App.photosOf(date);
    var open = st.open || {};
    var h = '';

    /* --- 进度概览 --- */
    var g = App.goalInfo();
    h += '<div class="card">';
    if (g.hasGoal) {
      var pctTxt = g.pct === null ? '—' : Math.round(g.pct * 100) + '%';
      h += '<div class="card-bd"><div class="ring-wrap">' +
        ring(g.pct, pctTxt, '目标进度') +
        '<div class="kv-list">' +
        '<div class="kv"><span class="k">当前体重</span><span class="v">' + (U.isNum(g.current) ? U.nice(g.current, 1) + ' kg' : '—') + '</span></div>' +
        '<div class="kv"><span class="k">目标体重</span><span class="v">' + U.nice(g.targetWeight, 1) + ' kg</span></div>' +
        '<div class="kv"><span class="k">已减 / 还差</span><span class="v">' +
        (U.isNum(g.done) ? U.nice(g.done, 1) : '—') + ' / ' + (U.isNum(g.left) ? U.nice(Math.max(0, g.left), 1) : '—') + ' kg</span></div>' +
        '<div class="kv"><span class="k">剩余天数</span><span class="v">' + (g.daysLeft === null ? '—' : (g.daysLeft >= 0 ? g.daysLeft + ' 天' : '已超期 ' + (-g.daysLeft) + ' 天')) + '</span></div>' +
        '</div></div>';
      var need = weeklyNeed(g);
      if (need !== null) {
        h += '<div class="hint">按计划需要每周减约 <b>' + U.nice(Math.abs(need), 2) + ' kg</b>，' +
          (need > 1 ? '节奏偏快，注意别掉肌肉和代谢。' : '节奏合理，保持就好。') + '</div>';
      }
    } else {
      h += '<div class="card-bd"><div class="row-between"><div>' +
        '<div style="font-size:15px;font-weight:700">还没有设定减脂目标</div>' +
        '<div class="hint" style="margin-top:4px">设定起始体重和目标体重后，这里会显示进度和每周需要减的重量。</div>' +
        '</div></div>' +
        '<button class="btn btn-primary btn-block mt12" data-act="goto-me" type="button">去设定目标</button></div>';
    }
    h += '</div>';

    /* --- 体重体脂（可折叠） --- */
    var prev = App.lastWeightBefore(date, false);
    var prevFat = lastNumericBefore(date, 'bodyFat');
    var height = U.num(st.settings.height, null);
    var bv = U.bmi(d.weight, height);
    var btag = U.bmiTag(bv);
    var wSum = sumBody(d);
    h += foldCard('ic-scale', '体重 · 体脂', wSum, 'body',
      '<div class="grid2">' +
      '<div class="field"><label>体重</label><div class="inp-unit">' + numInput('weight', date, d.weight, '0.0') + '<span class="u">kg</span></div>' +
      (prev ? '<div class="tiny">上次 ' + U.nice(prev.v, 1) + ' kg' + (deltaHTML(d.weight, prev.v, true, '') ? '　' + deltaHTML(d.weight, prev.v, true, '') : '') + '</div>' : '') +
      '</div>' +
      '<div class="field"><label>体脂率</label><div class="inp-unit">' + numInput('bodyFat', date, d.bodyFat, '0.0') + '<span class="u">%</span></div>' +
      (prevFat ? '<div class="tiny">上次 ' + U.nice(prevFat.v, 1) + '%</div>' : '') +
      '</div></div>' +
      (bv !== null ? '<div class="mt12" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span class="tag-soft' + (btag.tone === 'accent' ? ' accent' : btag.tone === 'warn' ? ' warn' : '') + '">BMI ' + U.nice(bv, 1) + ' · ' + btag.t + '</span>' +
        '<span class="tiny">身高 ' + U.nice(height, 0) + ' cm</span></div>'
        : '<div class="hint">在「我的」里填身高后，会自动算出 BMI。</div>')
    );

    /* --- 睡眠（可折叠） --- */
    h += foldCard('ic-moon', '睡眠', sumSleep(d), 'sleep',
      '<div class="grid2">' +
      '<div class="field"><label>入睡时间</label><input class="inp" type="time" data-f="sleepStart" data-date="' + date + '" data-rerender="1" value="' + U.attr(d.sleepStart) + '"></div>' +
      '<div class="field"><label>起床时间</label><input class="inp" type="time" data-f="sleepEnd" data-date="' + date + '" data-rerender="1" value="' + U.attr(d.sleepEnd) + '"></div>' +
      '</div>' +
      '<div class="field mt12"><label>睡眠时长（小时，可根据起止自动算出，也可直接改）</label>' +
      '<div class="inp-unit">' + numInput('sleepHours', date, d.sleepHours, '7.5') + '<span class="u">h</span></div></div>' +
      '<div class="field mt12"><label>睡得好吗</label><div class="stars">' +
      [1, 2, 3, 4, 5].map(function (n) {
        return '<button data-act="star" data-v="' + n + '" data-date="' + date + '" type="button" class="' + (d.sleepQuality >= n ? 'on' : '') +
          '" aria-label="' + n + ' 星">' + (d.sleepQuality >= n ? '★' : '☆') + '</button>';
      }).join('') + '</div></div>'
    );

    /* --- 运动（可折叠） --- */
    var exList = d.exercises || [];
    var exDur = exList.reduce(function (a, e) { return a + (U.num(e.dur, 0) || 0); }, 0);
    var exKcal = exList.reduce(function (a, e) { return a + (U.num(e.kcal, 0) || 0); }, 0);
    var exBody = '<div class="field"><label>今日步数</label><div class="inp-unit">' +
      numInput('steps', date, d.steps, '8000') + '<span class="u">步</span></div></div>';
    if (exList.length) {
      exBody += '<div class="mt12">' + exList.map(function (e) {
        var s = [];
        if (U.isNum(e.dur)) s.push(U.nice(e.dur, 0) + ' 分钟');
        if (U.isNum(e.kcal)) s.push(U.nice(e.kcal, 0) + ' kcal');
        if (e.note) s.push(e.note);
        return '<div class="item"><div class="it-main"><div class="it-t">' + U.esc(e.type) + '</div>' +
          (s.length ? '<div class="it-s">' + U.esc(s.join(' · ')) + '</div>' : '') + '</div>' +
          '<button class="it-x" data-act="del-ex" data-id="' + U.attr(e.id) + '" data-date="' + date + '" type="button" aria-label="删除运动">' + ic('ic-trash') + '</button></div>';
      }).join('') + '</div>';
    }
    if (exKcal) exBody += '<div class="hint">合计消耗约 <b>' + U.nice(exKcal, 0) + ' kcal</b></div>';
    exBody += '<button class="item-add mt12" data-act="add-ex" data-date="' + date + '" type="button">' + ic('ic-plus') + '添加运动</button>';
    h += foldCard('ic-run', '运动', sumEx(d), 'ex', exBody);

    /* --- 饮食（可折叠；每餐可记就餐时间；照片再单独收起，避免占屏） --- */
    var mBody = '';
    Export.MEALS.forEach(function (m) {
      var key = m[0], name = m[1];
      var mp = photos.filter(function (p) { return p.meal === key; });
      var mm = d.meals[key] || {};
      var phOpen = !!open['ph:' + key];
      mBody += '<div class="meal-block' + (phOpen ? ' ph-open' : '') + '">' +
        '<div class="meal-hd">' +
        '<span class="mh-t"><i class="dot"></i>' + name + '</span>' +
        '<input class="inp inp-time" type="time" data-f="meals.' + key + '.time" data-date="' + date + '" value="' + U.attr(mm.time) + '" aria-label="' + name + '就餐时间">' +
        '<button class="mh-add" data-act="add-photo" data-meal="' + key + '" data-date="' + date + '" type="button" aria-label="给' + name + '加照片">' + ic('ic-cam') + '</button>' +
        '</div>' +
        ta('meals.' + key + '.text', date, mm.text, '吃了什么？例：鸡胸肉沙拉 + 无糖酸奶', 2);
      if (mp.length) {
        mBody += '<button class="ph-toggle" data-act="fold-photos" data-key="' + key + '" type="button" aria-expanded="' + (phOpen ? 'true' : 'false') + '">' +
          ic('ic-cam') + mp.length + ' 张照片<span class="chev">' + ic('ic-down') + '</span></button>' +
          '<div class="photo-grid mt8">' +
          mp.map(function (p) {
            return '<div class="photo"><img src="' + U.attr(p.dataUrl) + '" alt="' + name + '照片" loading="lazy" data-act="view-photo" data-src="' + U.attr(p.dataUrl) + '">' +
              '<button class="p-x" data-act="del-photo" data-id="' + U.attr(p.id) + '" data-date="' + date + '" type="button" aria-label="删除照片">' + ic('ic-close') + '</button></div>';
          }).join('') +
          '</div>';
      }
      mBody += '</div>';
    });
    h += foldCard('ic-food', '饮食', sumMeals(d, photos), 'meals', mBody);

    /* --- 感受（可折叠） --- */
    var MOODS = [[1, '😣', '很难'], [2, '😕', '偏低'], [3, '😐', '一般'], [4, '🙂', '不错'], [5, '😄', '很棒']];
    h += foldCard('ic-heart', '减肥感受', sumFeeling(d), 'feeling',
      '<div class="field"><label>今天的心情</label><div class="mood-row">' +
      MOODS.map(function (m) {
        return '<button data-act="mood" data-v="' + m[0] + '" data-date="' + date + '" type="button" class="' + (d.feeling.mood === m[0] ? 'on' : '') + '">' +
          '<span class="em">' + m[1] + '</span>' + m[2] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field mt12"><label>记录一下（身体感受、想吃的、坚持难点…）</label>' +
      ta('feeling.text', date, d.feeling.text, '例：下午有点饿，喝了杯美式顶住了；体重没动但裤子松了。', 3) + '</div>'
    );

    return h;
  }

  function weeklyNeed(g) {
    if (!U.isNum(g.targetWeight) || !U.isNum(g.current) || !g.targetDate) return null;
    var days = U.diffDays(U.today(), g.targetDate);
    if (days <= 0) return null;
    var left = g.current - g.targetWeight;
    if (left <= 0) return 0;
    return left / (days / 7);
  }

  function lastNumericBefore(date, field) {
    var keys = Object.keys(S().days).filter(function (k) { return k < date; }).sort();
    for (var i = keys.length - 1; i >= 0; i--) {
      if (U.isNum(S().days[keys[i]][field])) return { date: keys[i], v: S().days[keys[i]][field] };
    }
    return null;
  }

  /* ================= 记录（日历 + 当日回看） ================= */
  function history() {
    var st = S();
    var h = '';

    h += '<div class="card"><div class="card-bd">' + calendarHTML(st.calY, st.calM, st.date) + '</div></div>';

    /* 当月小结 */
    var mk = st.calY + '-' + U.pad(st.calM + 1);
    var mdays = Object.keys(st.days).filter(function (k) { return k.slice(0, 7) === mk && !isEmpty2(st.days[k]); }).sort();
    var ws = mdays.map(function (k) { return st.days[k].weight; }).filter(U.isNum);
    var ss = mdays.map(function (k) { return st.days[k].sleepHours; }).filter(U.isNum);
    var stp = mdays.map(function (k) { return st.days[k].steps; }).filter(U.isNum);
    var wDelta = ws.length >= 2 ? ws[ws.length - 1] - ws[0] : null;
    h += '<div class="card">' + cardHead('ic-hist', (st.calM + 1) + ' 月小结', mdays.length + ' 天记录') +
      '<div class="card-bd"><div class="stats">' +
      statBox('记录天数', mdays.length, '天', '') +
      statBox('平均体重', ws.length ? U.nice(U.avg(ws), 1) : '—', ws.length ? 'kg' : '', ws.length ? '区间 ' + U.nice(Math.min.apply(null, ws), 1) + '~' + U.nice(Math.max.apply(null, ws), 1) : '') +
      statBox('月内变化', wDelta === null ? '—' : (wDelta > 0 ? '+' : '') + U.nice(wDelta, 1), wDelta === null ? '' : 'kg', ws.length >= 2 ? '首末对比' : '至少 2 次体重记录', wDelta === null ? '' : (wDelta < 0 ? 'tone-good' : 'tone-accent')) +
      statBox('平均睡眠', ss.length ? U.nice(U.avg(ss), 2) : '—', ss.length ? 'h' : '', '') +
      '</div>' +
      (stp.length ? '<div class="hint">本月日均步数约 <b>' + U.nice(U.avg(stp), 0) + '</b> 步</div>' : '') +
      '</div></div>';

    /* 选中日摘要 */
    var d = App.getDay(st.date, false);
    var photos = App.photosOf(st.date);
    var has = hasContent(d, photos);
    h += '<div class="sec-title">' + U.esc(U.label(st.date, true)) + ' · ' + U.relDay(st.date) + '</div>';
    if (!has) {
      h += '<div class="card"><div class="empty">' + ic('ic-edit') +
        '<p>这一天还没有记录</p>' +
        '<button class="btn btn-primary btn-sm" data-act="goto-day" data-date="' + st.date + '" type="button">去记录</button></div></div>';
    } else {
      h += daySummaryCard(d, photos, st.date);
    }

    /* 最近记录 */
    var recent = Object.keys(st.days).filter(function (k) { return !isEmpty2(st.days[k]); }).sort().reverse().slice(0, 12);
    if (recent.length) {
      h += '<div class="sec-title">最近记录</div>';
      h += recent.map(function (k) { return miniRow(st.days[k]); }).join('');
    }
    return h;
  }

  function isEmpty2(d) {
    if (!d) return true;
    if (U.isNum(d.weight) || U.isNum(d.bodyFat) || U.isNum(d.steps)) return false;
    if (d.sleepStart || d.sleepEnd || U.isNum(d.sleepHours) || U.isNum(d.sleepQuality)) return false;
    if ((d.exercises || []).length) return false;
    var m = d.meals || {};
    for (var k in m) if (m[k] && ((m[k].text || '').trim() || m[k].time)) return false;
    if (d.feeling && ((d.feeling.text || '').trim() || U.isNum(d.feeling.mood))) return false;
    return true;
  }
  function hasContent(d, photos) { return !isEmpty2(d) || (photos && photos.length); }

  function statBox(label, v, unit, sub, tone) {
    return '<div class="stat ' + (tone || '') + '"><div class="s-lb">' + label + '</div>' +
      '<div class="s-v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      (sub ? '<div class="s-sub">' + sub + '</div>' : '') + '</div>';
  }

  function daySummaryCard(d, photos, date) {
    var h = '<div class="card"><div class="card-bd">';
    var rows = [];
    if (U.isNum(d.weight)) rows.push(['体重', U.nice(d.weight, 1) + ' kg']);
    if (U.isNum(d.bodyFat)) rows.push(['体脂率', U.nice(d.bodyFat, 1) + ' %']);
    if (U.isNum(d.sleepHours) || d.sleepStart) {
      rows.push(['睡眠', (d.sleepStart ? d.sleepStart + ' → ' + (d.sleepEnd || '?') : '') + (U.isNum(d.sleepHours) ? '（' + U.nice(d.sleepHours, 2) + ' h）' : '')]);
    }
    if (U.isNum(d.sleepQuality)) rows.push(['睡眠质量', '★'.repeat(d.sleepQuality)]);
    if (U.isNum(d.steps)) rows.push(['步数', U.nice(d.steps, 0) + ' 步']);
    if ((d.exercises || []).length) rows.push(['运动', Export.exText(d.exercises)]);
    Export.MEALS.forEach(function (m) {
      var mm = (d.meals && d.meals[m[0]]) || {};
      var t = (mm.text || '').trim();
      if (t || mm.time) rows.push([m[1], (mm.time ? mm.time + ' ' : '') + t]);
    });
    if (d.feeling && d.feeling.text) rows.push(['感受' + (d.feeling.mood ? '（' + Export.MOOD[d.feeling.mood] + '）' : ''), d.feeling.text]);

    h += rows.map(function (r) {
      return '<div class="kv" style="align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)">' +
        '<span class="k" style="flex:none;width:64px">' + U.esc(r[0]) + '</span>' +
        '<span class="v" style="text-align:right;font-weight:500;white-space:normal;overflow-wrap:anywhere">' + U.esc(r[1]) + '</span></div>';
    }).join('');

    if (photos && photos.length) {
      h += '<div class="photo-grid mt12">' + photos.map(function (p) {
        return '<div class="photo"><img src="' + U.attr(p.dataUrl) + '" alt="饮食照片" loading="lazy" data-act="view-photo" data-src="' + U.attr(p.dataUrl) + '"></div>';
      }).join('') + '</div>';
    }
    h += '<div class="btn-row mt12">' +
      '<button class="btn btn-primary" data-act="goto-day" data-date="' + date + '" type="button">编辑这一天</button>' +
      '</div>';
    h += '</div></div>';
    return h;
  }

  function miniRow(d) {
    var bits = [];
    if (U.isNum(d.weight)) bits.push(U.nice(d.weight, 1) + 'kg');
    if (U.isNum(d.bodyFat)) bits.push('体脂' + U.nice(d.bodyFat, 1) + '%');
    if (U.isNum(d.sleepHours)) bits.push('睡' + U.nice(d.sleepHours, 1) + 'h');
    if (U.isNum(d.steps)) bits.push(U.nice(d.steps, 0) + '步');
    if ((d.exercises || []).length) bits.push('运动' + d.exercises.length + '项');
    return '<button class="item" data-act="goto-day" data-date="' + d.date + '" type="button" style="width:100%;text-align:left">' +
      '<div class="it-main"><div class="it-t">' + U.esc(U.relDay(d.date)) + ' <span style="font-weight:400;color:var(--muted);font-size:12.5px">' + U.esc(U.label(d.date, false)) + '</span></div>' +
      '<div class="it-s">' + (bits.length ? U.esc(bits.join(' · ')) : '仅饮食 / 感受记录') + '</div></div>' +
      '<span class="it-x">' + ic('ic-back') + '</span></button>';
  }

  /* ================= 趋势 ================= */
  function trend() {
    var st = S();
    var h = '';
    var ranges = [[7, '近 7 天'], [30, '近 30 天'], [90, '近 90 天'], [0, '全部']];
    h += '<div class="seg mb8" style="margin-bottom:12px">' + ranges.map(function (r) {
      var on = st.trendDays === r[0] ? ' on' : '';
      return '<button class="' + on.trim() + '" data-act="range" data-v="' + r[0] + '" type="button">' + r[1] + '</button>';
    }).join('') + '</div>';

    var from = null;
    if (st.trendDays > 0) from = U.addDays(U.today(), -(st.trendDays - 1));
    var days = Object.keys(st.days).sort().filter(function (k) { return !from || k >= from; });
    var g = App.goalInfo();

    var wPts = days.filter(function (k) { return U.isNum(st.days[k].weight); })
      .map(function (k) { return { d: k, v: st.days[k].weight }; });
    var fPts = days.filter(function (k) { return U.isNum(st.days[k].bodyFat); })
      .map(function (k) { return { d: k, v: st.days[k].bodyFat }; });
    var sPts = days.filter(function (k) { return U.isNum(st.days[k].sleepHours); })
      .map(function (k) { return { d: k, v: st.days[k].sleepHours }; });
    var stPts = days.filter(function (k) { return U.isNum(st.days[k].steps); })
      .map(function (k) { return { d: k, v: st.days[k].steps }; });

    /* 体重 */
    h += '<div class="card">' + cardHead('ic-scale', '体重变化', wPts.length + ' 个数据点') + '<div class="card-bd">';
    if (wPts.length) {
      var w = wPts.map(function (p) { return p.v; });
      var dlt = w.length >= 2 ? w[w.length - 1] - w[0] : null;
      h += '<div class="stats" style="margin-bottom:12px">' +
        statBox('最新', U.nice(w[w.length - 1], 1), 'kg', wPts[wPts.length - 1].d.slice(5).replace('-', '/')) +
        statBox('区间变化', dlt === null ? '—' : (dlt > 0 ? '+' : '') + U.nice(dlt, 1), dlt === null ? '' : 'kg',
          dlt === null ? '至少 2 次记录' : (dlt < 0 ? '在往下走' : '略有回升'), dlt === null ? '' : (dlt < 0 ? 'tone-good' : 'tone-accent')) +
        '</div>';
    }
    h += Charts.line({
      pts: wPts, unit: 'kg', height: 180, color: '#1F5F4B', decimals: 1, avg7: true,
      goal: U.isNum(g.targetWeight) ? { v: g.targetWeight, label: U.nice(g.targetWeight, 1) + 'kg' } : null
    });
    if (wPts.length >= 5) {
      h += '<div class="legend"><span><i style="background:#1F5F4B"></i>体重</span>' +
        '<span><i style="background:#B9A88F"></i>7 日均线</span>' +
        (U.isNum(g.targetWeight) ? '<span><i style="background:#DE6B32"></i>目标线</span>' : '') + '</div>';
    }
    h += '</div></div>';

    /* 体脂 */
    h += '<div class="card">' + cardHead('ic-flame', '体脂率', fPts.length ? fPts.length + ' 个数据点' : '') + '<div class="card-bd">' +
      Charts.line({ pts: fPts, unit: '%', height: 160, color: '#DE6B32', decimals: 1 }) +
      (fPts.length >= 5 ? '<div class="hint">体脂率受测量时间、水分影响较大，看趋势比看单日数值更靠谱。</div>' : '') +
      '</div></div>';

    /* 步数 */
    var stAvg = stPts.length ? U.avg(stPts.map(function (p) { return p.v; })) : null;
    h += '<div class="card">' + cardHead('ic-run', '每日步数', stAvg ? '平均 ' + U.nice(stAvg, 0) + ' 步' : '') + '<div class="card-bd">' +
      Charts.bar({ pts: stPts, height: 150, color: '#2C7D63', unit: '', decimals: 0, limit: 31 }) +
      (stPts.length >= 3 ? '<div class="hint">日均 <b>' + U.nice(stAvg, 0) + '</b> 步，最高 ' +
        U.nice(Math.max.apply(null, stPts.map(function (p) { return p.v; })), 0) + ' 步。</div>' : '') +
      '</div></div>';

    /* 睡眠 */
    var sAvg = sPts.length ? U.avg(sPts.map(function (p) { return p.v; })) : null;
    h += '<div class="card">' + cardHead('ic-moon', '睡眠时长', sAvg ? '平均 ' + U.nice(sAvg, 2) + ' 小时' : '') + '<div class="card-bd">' +
      Charts.bar({ pts: sPts, height: 150, color: '#4B6FA8', unit: 'h', decimals: 1, limit: 31, goal: { v: 7.5, color: '#DE6B32' } }) +
      (sPts.length >= 3 ? '<div class="hint">日均 <b>' + U.nice(sAvg, 2) + '</b> 小时，' +
        (sAvg >= 7 ? '睡眠时长基本达标。' : '距离 7 小时还差一点，睡眠不足会影响减脂效率。') + '</div>' : '') +
      '</div></div>';

    /* 运动汇总 */
    var exAll = [], exDays = 0;
    days.forEach(function (k) {
      var ex = st.days[k].exercises || [];
      if (ex.length) { exDays++; exAll = exAll.concat(ex); }
    });
    var totalDur = exAll.reduce(function (a, e) { return a + (U.num(e.dur, 0) || 0); }, 0);
    var totalKcal = exAll.reduce(function (a, e) { return a + (U.num(e.kcal, 0) || 0); }, 0);
    var byType = {};
    exAll.forEach(function (e) {
      byType[e.type] = byType[e.type] || { n: 0, dur: 0 };
      byType[e.type].n++;
      byType[e.type].dur += (U.num(e.dur, 0) || 0);
    });
    var topTypes = Object.keys(byType).sort(function (a, b) { return byType[b].dur - byType[a].dur; }).slice(0, 5);
    h += '<div class="card">' + cardHead('ic-run', '运动汇总', exDays + ' 天有运动') + '<div class="card-bd">';
    if (exAll.length) {
      h += '<div class="stats" style="margin-bottom:12px">' +
        statBox('运动次数', exAll.length, '次', '') +
        statBox('总时长', U.nice(totalDur, 0), '分钟', totalDur ? '约 ' + U.nice(totalDur / 60, 1) + ' 小时' : '') +
        statBox('总消耗', totalKcal ? U.nice(totalKcal, 0) : '—', totalKcal ? 'kcal' : '', '') +
        statBox('周均时长', totalDur ? U.nice(totalDur / Math.max(1, (st.trendDays || 30) / 7), 0) : '—', totalDur ? '分钟' : '', '') +
        '</div>';
      h += topTypes.map(function (t) {
        var o = byType[t];
        var pct = totalDur ? o.dur / totalDur : 0;
        return '<div style="margin-top:10px"><div class="row-between" style="margin-bottom:5px">' +
          '<span style="font-size:13.5px;font-weight:600">' + U.esc(t) + '</span>' +
          '<span style="font-size:12px;color:var(--muted)">' + o.n + ' 次 · ' + U.nice(o.dur, 0) + ' 分钟</span></div>' +
          '<div class="bar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div></div>';
      }).join('');
    } else {
      h += '<div class="chart-empty">这段时间还没有运动记录</div>';
    }
    h += '</div></div>';

    /* 饮食记录密度 */
    var mealDays = 0;
    var photoCnt = st.photoCount || 0;
    days.forEach(function (k) {
      var m = st.days[k].meals || {};
      var any = ['breakfast', 'lunch', 'dinner', 'snack'].some(function (x) { return m[x] && m[x].text && m[x].text.trim(); });
      var ps = App.photosOf(k);
      if (any || ps.length) mealDays++;
    });
    h += '<div class="card">' + cardHead('ic-food', '饮食记录', '') + '<div class="card-bd"><div class="stats">' +
      statBox('有饮食记录', mealDays, '天', days.length ? '占比 ' + Math.round(mealDays / days.length * 100) + '%' : '') +
      statBox('饮食照片', photoCnt, '张', '') +
      '</div><div class="hint">记录得越细，越容易发现"吃进去"和"掉下来"之间的关系。</div></div></div>';

    return h;
  }

  /* ================= 我的 ================= */

  /** 时间戳 → 口语化「多久之前」 */
  function ago(ms) {
    if (!ms) return '—';
    var s = Math.floor((Date.now() - Number(ms)) / 1000);
    if (!isFinite(s) || s < 0) return '刚刚';
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return U.label(U.toKey(new Date(Number(ms))), true);
  }

  /* 云端备份卡：本机为主，云端只做备份与换机恢复。
     云组件不可用时，这里明确说明，且不影响其余任何功能。 */
  function cloudCard() {
    var C = w.Cloud;
    if (!C) return '';   // 没有云模块（例如单文件自部署版）：整张卡不出现，而不是显示一张坏掉的卡
    var st = C ? C.status : 'unavailable';
    var signed = !!(C && C.signedIn);
    var h = '<div class="card" id="cloudCard">' +
      cardHead('ic-cloud', '云端备份', signed ? '已登录' : (st === 'ready' ? '未登录' : ''), { bg: '#E7F1EC', fg: '#1F5F4B' }) +
      '<div class="card-bd">';

    if (!C || st === 'unavailable' || st === 'error') {
      h += '<div class="hint" style="margin-top:0">' + U.esc((C && C.lastError) || '云端组件未能加载，不影响本机记录、导出与其余功能。') + '</div>' +
        '<button class="btn btn-outline btn-block mt12" data-act="cloud-retry" type="button">重新连接云端</button>' +
        '</div></div>';
      return h;
    }
    if (st === 'idle' || st === 'loading') {
      h += '<div class="hint" style="margin-top:0">正在连接云端…</div></div></div>';
      return h;
    }

    if (!signed) {
      h += '<div class="hint" style="margin-top:0">登录后可以把本机记录与照片备份到云端，换手机时用同一账号恢复。<b>不登录也完全不影响本机使用。</b></div>' +
        '<div class="field mt12"><label for="cl-phone">手机号</label>' +
        '<input class="inp" id="cl-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel">' +
        '<div class="field-err" id="cl-phone-err"></div></div>' +
        '<div class="code-row mt8">' +
        '<input class="inp" id="cl-code" type="text" inputmode="numeric" maxlength="6" placeholder="短信验证码" autocomplete="one-time-code">' +
        '<button class="btn btn-outline btn-code" id="cl-send" data-act="cloud-send" type="button">获取验证码</button>' +
        '</div>' +
        '<button class="btn btn-primary btn-block mt12" data-act="cloud-login" type="button">登录 / 注册</button>' +
        '<div class="io-mini"><button class="lnk" data-act="cloud-wechat" type="button">' + ic('ic-wechat') + '使用微信登录</button></div>' +
        '</div></div>';
      return h;
    }

    var lb = C.lastBackup;
    h += '<div class="kv"><span class="k">当前账号</span><span class="v">' + U.esc(C.userName || '已登录') + '</span></div>' +
      '<div class="kv"><span class="k">上次备份</span><span class="v">' +
      (lb && lb.at ? U.esc(ago(lb.at)) + '（' + (lb.days || 0) + ' 天 · ' + (lb.photos || 0) + ' 张照片）' : '还没有备份过') +
      '</span></div>' +
      '<button class="btn btn-primary btn-block mt12" data-act="cloud-backup" type="button">' + ic('ic-up') + '备份到云端</button>' +
      '<button class="btn btn-outline btn-block mt8" data-act="cloud-restore" type="button">从云端恢复到本机</button>' +
      '<div class="hint">恢复时默认<b>保留较新的一份</b>，手机上更新的记录不会被旧备份覆盖。</div>' +
      '<div class="io-mini"><button class="lnk" data-act="cloud-logout" type="button">退出登录</button></div>' +
      '</div></div>';
    return h;
  }

  function me() {
    var st = S();
    var s = st.settings || {};
    var g = App.goalInfo();
    var h = '';

    /* 目标设置 */
    h += '<div class="card">' + cardHead('ic-target', '减脂目标', g.hasGoal ? (g.pct !== null ? Math.round(g.pct * 100) + '% 完成' : '') : '未设定') +
      '<div class="card-bd">';
    if (g.hasGoal) {
      h += '<div class="ring-wrap" style="margin-bottom:16px">' +
        ring(g.pct, g.pct === null ? '—' : Math.round(g.pct * 100) + '%', '已完成') +
        '<div class="kv-list">' +
        '<div class="kv"><span class="k">起始 → 目标</span><span class="v">' + U.nice(g.startWeight, 1) + ' → ' + U.nice(g.targetWeight, 1) + ' kg</span></div>' +
        '<div class="kv"><span class="k">需要减</span><span class="v">' + U.nice(g.total, 1) + ' kg</span></div>' +
        '<div class="kv"><span class="k">已经减掉</span><span class="v">' + (U.isNum(g.done) ? U.nice(g.done, 1) : '—') + ' kg</span></div>' +
        '<div class="kv"><span class="k">还差</span><span class="v">' + (U.isNum(g.left) ? U.nice(Math.max(0, g.left), 1) : '—') + ' kg</span></div>' +
        '</div></div>';
      var need = weeklyNeed(g);
      if (need !== null) {
        h += '<div class="hint" style="margin-bottom:14px">计划到 <b>' + U.esc(g.targetDate) + '</b>（还剩 ' +
          Math.max(0, g.daysLeft) + ' 天），需要每周减 <b>' + U.nice(Math.abs(need), 2) + ' kg</b>。' +
          (need > 1 ? '这个速度偏快，建议放宽周期。' : need > 0.75 ? '节奏偏紧，配合力量训练保住肌肉。' : '节奏健康，容易坚持。') + '</div>';
      }
    }
    h += '<div class="grid2">' +
      '<div class="field"><label>身高（cm）</label><input class="inp" id="g-height" type="text" inputmode="decimal" value="' + val(s.height) + '" placeholder="165"></div>' +
      '<div class="field"><label>起始体重（kg）</label><input class="inp" id="g-start" type="text" inputmode="decimal" value="' + val(s.startWeight) + '" placeholder="70.0"></div>' +
      '<div class="field"><label>起始日期</label><input class="inp" id="g-startdate" type="date" value="' + U.attr(s.startDate || U.today()) + '"></div>' +
      '<div class="field"><label>目标体重（kg）</label><input class="inp" id="g-target" type="text" inputmode="decimal" value="' + val(s.targetWeight) + '" placeholder="60.0"></div>' +
      '<div class="field" style="grid-column:1/-1"><label>目标日期</label><input class="inp" id="g-targetdate" type="date" value="' + U.attr(s.targetDate || '') + '"></div>' +
      '</div>' +
      '<div class="btn-row mt12">' +
      '<button class="btn btn-outline" data-act="quick-goal-from-current" type="button">取最新体重作起始</button>' +
      '<button class="btn btn-primary" data-act="save-goal" type="button">' + ic('ic-check') + '保存目标</button>' +
      '</div>' +
      '<div class="hint">目标日期建议设在 3~6 个月后。每周减 0.5%~1% 体重的节奏最容易长期维持，也最不容易反弹。</div>' +
      '</div></div>';

    /* 数据导出：主入口是 Excel；完整备份与恢复收成一行小字，界面保持清爽 */
    h += '<div class="card">' + cardHead('ic-down', '数据导出', 'Excel 表格') +
      '<div class="card-bd">' +
      '<button class="btn btn-primary btn-block" data-act="export-xlsx" type="button">' + ic('ic-down') + '导出为 Excel（.xlsx）</button>' +
      '<div class="hint" style="margin-top:10px">含「每日记录」与「运动明细」两个工作表，可用 Excel / WPS 直接打开、做图表。</div>' +
      '<div class="io-mini">' +
      '<button class="lnk" data-act="export-json" type="button">完整备份（含照片）</button>' +
      '<span class="dot-sep">·</span>' +
      '<button class="lnk" data-act="import-json" type="button">从备份恢复</button>' +
      '</div>' +
      '</div></div>';

    /* 云端备份（可选层）：本机为主，云端负责备份与换机恢复 */
    h += cloudCard();

    /* 危险操作 */
    h += '<div class="card danger-zone">' + cardHead('ic-trash', '清除数据', '', { bg: '#FAE9E4', fg: '#B8452B' }) +
      '<div class="card-bd"><div class="hint" style="margin-top:0">会删除本机上全部记录与照片，无法撤销。建议先导出备份' +
      (w.Cloud ? '或做一次云端备份。' : '（「完整备份」含照片，可事后恢复）。') + '</div>' +
      '<button class="btn btn-danger btn-block mt12" data-act="clear-all" type="button">清除全部数据</button></div></div>';

    /* 存储与保护：不只是告诉用户「用的是哪种存储」，还要给出「数据会不会被清掉」的答案 */
    h += storageBlock();
    return h;
  }

  /** 字节数说人话 */
  function fmtBytes(n) {
    if (!n || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function storageBlock() {
    var db = w.DB || {};
    var idbOk = !!db.isIndexedDB;
    var d = (typeof db.diag === 'function' && db.diag()) || {};
    var perm = db.persistence || 'unknown';
    var q = db.quota || null;

    var h = '<div class="store-note' + (idbOk ? '' : ' store-note-warn') + '" id="storeNote">';
    h += '<span class="sn-ic">' + ic(idbOk ? 'ic-db' : 'ic-warn') + '</span><span class="sn-tx">';

    if (idbOk) {
      // 「会上传」这句只在真有云模块时才成立 —— 自部署单文件版没有任何上传能力，
      // 说了反而让人怀疑，所以按实际情况写。
      h += '<b>数据保存在本机 本地数据库（IndexedDB）</b>，离线可用、不连网、不上传' +
        (w.Cloud ? '，只有你主动点「备份到云端」时才会上传。' : '。');
      if (perm === 'granted') {
        h += '<div class="sn-sub">已获得浏览器「<b>持久存储</b>」授权 —— 除非你主动清除，系统不会自动删掉它。</div>';
      } else if (perm === 'denied') {
        h += '<div class="sn-sub">尚未获得「持久存储」授权，手机空间告急时系统可能回收本站数据。</div>' +
          '<div class="sn-acts"><button class="btn btn-sm btn-outline" data-act="ask-persist" type="button">' +
          '申请持久存储保护</button></div>';
      } else if (perm === 'unsupported') {
        h += '<div class="sn-sub">此浏览器不提供「持久存储」授权接口。建议：把这个页面<b>添加到主屏幕</b>再使用' +
          (w.Cloud ? '，并定期做一次云端备份。' : '，并定期导出一份备份文件。') + '</div>';
      } else {
        h += '<div class="sn-sub">正在申请「持久存储」保护…</div>';
      }
      if (q && q.quota) {
        h += '<div class="sn-sub">当前占用 ' + fmtBytes(q.usage) + ' / 可用 ' + fmtBytes(q.quota) + '</div>';
      }
    } else {
      h += '<b>当前环境拿不到本地数据库，已退到简易存储（localStorage）</b>。' +
        '简易存储容量小、且系统在空间紧张时可能直接清空，<b>不适合长期存数据</b>。';
      if (d.reason) h += '<div class="sn-sub">原因：' + U.esc(d.reason) + '</div>';
      h += '<div class="sn-sub">请在手机浏览器里<b>直接打开</b>本链接（不要从聊天窗口或预览框内打开），并退出无痕模式。</div>';
      h += '<div class="sn-acts">' +
        '<button class="btn btn-sm btn-outline" data-act="ask-persist" type="button">申请持久存储</button>' +
        '<button class="btn btn-sm btn-primary" data-act="export-json" type="button">先导出一份备份</button>' +
        '</div>';
    }
    h += '</span></div>';
    return h;
  }

  /* 说明：原「本地存储」统计块与分享入口已按要求移除。 */

  w.Views = {
    topbar: topbar, today: today, history: history, trend: trend, me: me,
    calendarSheet: calendarSheet, calendarHTML: calendarHTML,
    weeklyNeed: weeklyNeed, isEmptyDay: isEmpty2, cardSummary: cardSummary
  };
})(window);

</script>
</body>
</html>
